<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Luminae Landscape Cockpit Mockup</title>
  <style>
    :root {
      --bg: #05050d;
      --panel: rgba(8, 7, 18, 0.92);
      --panel-2: rgba(17, 12, 18, 0.92);
      --line: rgba(196, 170, 105, 0.38);
      --line-soft: rgba(168, 197, 255, 0.22);
      --text: #dfe5ff;
      --muted: #7e879d;
      --violet: #c4aaff;
      --brass: #d6af64;
      --blue: #a8c5ff;
      --flare: #ff5a45;
      --radiance: #e7c553;
      --verdance: #44c87d;
      --continuum: #4d8dff;
      --abyss: #b64fe8;
      --singularity: #d8d9e8;
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 42% 8%, rgba(78, 105, 180, 0.26), transparent 34%),
        radial-gradient(circle at 80% 26%, rgba(191, 139, 61, 0.12), transparent 24%),
        linear-gradient(180deg, #080815, #020208);
    }

    .frame {
      width: 844px;
      height: 390px;
      overflow: hidden;
      background:
        radial-gradient(circle at 52% 6%, rgba(125, 98, 190, 0.12), transparent 36%),
        radial-gradient(circle at 70% 90%, rgba(210, 157, 73, 0.08), transparent 34%),
        var(--bg);
      color: var(--text);
      border: 1px solid rgba(190, 177, 230, 0.14);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.03), 0 20px 80px rgba(0,0,0,0.5);
    }

    .topbar {
      height: 42px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 0 16px;
      border-bottom: 1px solid rgba(214, 175, 100, 0.32);
      background: rgba(5, 5, 13, 0.92);
    }

    .brand {
      font-family: Georgia, serif;
      font-weight: 800;
      letter-spacing: 0.03em;
      color: #d8dcff;
      text-shadow: 0 0 18px rgba(144, 156, 255, 0.45);
      font-size: 16px;
    }

    .turn-pill {
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 4px 12px 4px 6px;
      border-radius: 999px;
      background: rgba(20, 22, 36, 0.86);
      color: #b9c3d8;
      font-weight: 800;
      font-size: 13px;
    }

    .avatar {
      width: 25px;
      height: 25px;
      border-radius: 50%;
      background: radial-gradient(circle, #ffffff 0 4px, #705dff 5px 9px, #17162a 10px);
      border: 2px solid rgba(125, 104, 255, 0.7);
      box-shadow: 0 0 16px rgba(125, 104, 255, 0.5);
    }

    .menu {
      justify-self: end;
      color: #9ca6ba;
      letter-spacing: 0.16em;
      font-weight: 900;
    }

    .layout {
      height: calc(100% - 42px);
      display: grid;
      grid-template-columns: minmax(0, 1fr) 258px;
      gap: 8px;
      padding: 8px;
    }

    .left {
      min-width: 0;
      display: grid;
      grid-template-rows: 112px minmax(0, 1fr);
      gap: 8px;
    }

    .panel {
      position: relative;
      border: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(7, 7, 18, 0.95), rgba(3, 4, 10, 0.98));
      overflow: hidden;
    }

    .label {
      position: absolute;
      left: 14px;
      top: 9px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      text-transform: uppercase;
      font-weight: 900;
      letter-spacing: 0.12em;
      z-index: 4;
    }

    .label small {
      display: block;
      margin-top: 2px;
      color: rgba(223, 229, 255, 0.42);
      font-size: 6px;
      letter-spacing: 0.16em;
    }

    .terminus .label { color: var(--violet); }
    .forge .label { color: var(--brass); }

    .edge {
      position: absolute;
      left: 22px;
      right: 18px;
      top: 47px;
      height: 40px;
      border-top: 1px solid rgba(230, 208, 153, 0.52);
      border-radius: 50% 50% 0 0 / 75% 75% 0 0;
      background: radial-gradient(ellipse at top, rgba(184, 152, 255, 0.14), transparent 70%);
      box-shadow: 0 -8px 28px rgba(196, 170, 255, 0.14);
    }

    .luminaries {
      position: absolute;
      left: 18px;
      top: 48px;
      display: flex;
      gap: 14px;
      z-index: 3;
    }

    .luminary {
      width: 78px;
      height: 60px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.12);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.08), transparent 38%),
        radial-gradient(circle at 50% 18%, var(--a), transparent 32%),
        linear-gradient(140deg, rgba(8,8,16,0.98), rgba(22,20,28,0.94));
      box-shadow: 0 0 18px color-mix(in srgb, var(--a) 28%, transparent);
    }

    .luminary::before {
      content: "";
      position: absolute;
      width: 1px;
      height: 34px;
      margin-left: 38px;
      margin-top: -33px;
      background: var(--a);
      box-shadow: 0 0 12px var(--a);
    }

    .luminary::after {
      content: attr(data-name);
      position: absolute;
      width: 70px;
      margin: 34px 4px 0;
      font-size: 8px;
      font-weight: 800;
      line-height: 1.1;
      color: rgba(255,255,255,0.85);
    }

    .forge {
      background:
        radial-gradient(ellipse at 52% 0%, rgba(212, 168, 75, 0.16), transparent 42%),
        linear-gradient(180deg, rgba(23, 14, 9, 0.96), rgba(4, 5, 10, 0.98));
    }

    .cost-view {
      position: absolute;
      left: 14px;
      top: 37px;
      display: flex;
      gap: 8px;
      align-items: center;
      color: rgba(255,255,255,0.35);
      font-size: 7px;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      font-weight: 900;
    }

    .chip {
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,0.12);
      color: #e8e8ef;
      letter-spacing: 0;
      text-transform: none;
      font-size: 10px;
    }

    .full {
      position: absolute;
      right: 14px;
      top: 14px;
      color: #9badc8;
      font-size: 10px;
      text-transform: uppercase;
      font-weight: 900;
      letter-spacing: 0.09em;
    }

    .tiers {
      position: absolute;
      inset: 54px 10px 8px;
      display: grid;
      grid-template-rows: repeat(3, 1fr);
      gap: 5px;
    }

    .tier {
      display: grid;
      grid-template-columns: 42px repeat(4, 54px);
      align-items: center;
      gap: 8px;
      padding: 3px 8px;
      border: 1px solid rgba(214, 175, 100, 0.28);
      background: rgba(255,255,255,0.025);
    }

    .deck, .artifact {
      height: 34px;
      border-radius: 5px;
      border: 1px solid rgba(214, 175, 100, 0.42);
      background: radial-gradient(circle at center, rgba(255,255,255,0.16), transparent 45%), #090a13;
    }

    .deck::after {
      content: attr(data-tier);
      display: grid;
      place-items: center;
      height: 100%;
      color: var(--brass);
      font-family: Georgia, serif;
      font-weight: 900;
      font-size: 13px;
    }

    .artifact {
      border-color: rgba(255,255,255,0.16);
      background:
        radial-gradient(circle at 48% 20%, var(--a), transparent 30%),
        linear-gradient(150deg, rgba(16,18,28,0.95), rgba(3,3,8,1));
    }

    .dock {
      min-width: 0;
      display: grid;
      grid-template-rows: 54px minmax(0, 1fr) 34px;
      gap: 8px;
    }

    .status {
      border: 1px solid var(--line-soft);
      background: rgba(7, 6, 17, 0.95);
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
    }

    .player {
      display: flex;
      gap: 8px;
      min-width: 0;
      align-items: center;
      font-size: 13px;
      font-weight: 900;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .counts {
      display: flex;
      gap: 9px;
      align-items: center;
      font-size: 13px;
      color: var(--blue);
      font-weight: 900;
    }

    .seal {
      width: 21px;
      height: 30px;
      border: 1px solid rgba(214,175,100,.75);
      clip-path: polygon(50% 0, 92% 20%, 82% 82%, 50% 100%, 18% 82%, 8% 20%);
      background: radial-gradient(circle, rgba(255,224,152,.26), transparent 56%);
    }

    .well {
      border: 1px solid var(--line-soft);
      background:
        radial-gradient(circle at 50% 0%, rgba(102, 83, 175, 0.16), transparent 46%),
        rgba(5, 4, 14, 0.96);
      padding: 9px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 8px;
    }

    .well-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--blue);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-size: 11px;
      font-weight: 900;
    }

    .channels {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
      align-content: start;
    }

    .channel {
      min-height: 46px;
      border: 1px solid color-mix(in srgb, var(--a) 58%, transparent);
      border-radius: 9px;
      background:
        radial-gradient(circle at 50% 30%, color-mix(in srgb, var(--a) 26%, transparent), transparent 42%),
        rgba(255,255,255,0.025);
      display: grid;
      grid-template-columns: 34px 1fr;
      align-items: center;
      padding: 5px;
      gap: 4px;
    }

    .orb {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: radial-gradient(circle, #fff 0 3px, var(--a) 4px 10px, #080912 11px);
      box-shadow: 0 0 14px color-mix(in srgb, var(--a) 68%, transparent);
      justify-self: center;
    }

    .channel b {
      display: block;
      font-size: 7px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: rgba(190, 207, 245, 0.82);
    }

    .channel span {
      display: block;
      margin-top: 2px;
      font-size: 15px;
      font-weight: 900;
      color: rgba(255,255,255,0.78);
      line-height: 1;
    }

    .pips {
      margin-top: 3px;
      display: flex;
      gap: 2px;
    }

    .pip {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--a);
      opacity: 0.8;
    }

    .harness {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
      color: rgba(255,255,255,0.42);
      font-size: 10px;
    }

    .harness button {
      border: 1px solid rgba(168, 197, 255, 0.34);
      background: rgba(71, 119, 255, 0.16);
      color: var(--blue);
      border-radius: 999px;
      padding: 6px 13px;
      font-weight: 900;
      font-size: 11px;
    }

    .nav {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .nav div {
      display: grid;
      place-items: center;
      border: 1px solid rgba(168, 197, 255, 0.16);
      background: rgba(10, 13, 25, 0.9);
      color: #9fb6d7;
      font-size: 10px;
      font-weight: 900;
      border-radius: 7px;
    }

    .nav div:first-child {
      color: #38a5ff;
      border-color: rgba(56, 165, 255, 0.42);
      box-shadow: inset 0 -2px 0 #38a5ff;
    }
  </style>
</head>
<body>
  <main class="frame" aria-label="Luminae horizontal cockpit mockup">
    <header class="topbar">
      <div class="brand">LUMINAe</div>
      <div class="turn-pill"><span class="avatar"></span><span>Lumii</span><span style="color:var(--brass)">0</span><span>R1</span></div>
      <div class="menu">•••</div>
    </header>

    <section class="layout">
      <div class="left">
        <section class="panel terminus">
          <div class="label"><span>▮</span><div>The Terminus<small>Edge of the observable universe</small></div></div>
          <div class="edge"></div>
          <div class="luminaries">
            <div class="luminary" style="--a:var(--verdance)" data-name="Verdant Oracle"></div>
            <div class="luminary" style="--a:var(--radiance)" data-name="Glass Orchard"></div>
            <div class="luminary" style="--a:var(--flare)" data-name="Ember Sovereign"></div>
          </div>
        </section>

        <section class="panel forge">
          <div class="label"><span>⌁</span><div>The Forge</div></div>
          <div class="full">▦ Full</div>
          <div class="cost-view">Cost View <span class="chip">Needed</span></div>
          <div class="tiers">
            <div class="tier">
              <div class="deck" data-tier="III"></div>
              <div class="artifact" style="--a:var(--abyss)"></div>
              <div class="artifact" style="--a:var(--verdance)"></div>
              <div class="artifact" style="--a:var(--radiance)"></div>
              <div class="artifact" style="--a:var(--continuum)"></div>
            </div>
            <div class="tier">
              <div class="deck" data-tier="II"></div>
              <div class="artifact" style="--a:var(--flare)"></div>
              <div class="artifact" style="--a:var(--continuum)"></div>
              <div class="artifact" style="--a:var(--verdance)"></div>
              <div class="artifact" style="--a:var(--abyss)"></div>
            </div>
            <div class="tier">
              <div class="deck" data-tier="I"></div>
              <div class="artifact" style="--a:var(--radiance)"></div>
              <div class="artifact" style="--a:var(--verdance)"></div>
              <div class="artifact" style="--a:var(--flare)"></div>
              <div class="artifact" style="--a:var(--continuum)"></div>
            </div>
          </div>
        </section>
      </div>

      <aside class="dock">
        <section class="status">
          <div class="player"><span class="avatar"></span><span>You · your turn</span></div>
          <div class="counts"><span>✋ 3/10</span><span class="seal"></span><span>0/15</span></div>
        </section>

        <section class="well">
          <div class="well-title"><span>Affinity Well</span><span>Shared Reservoir</span></div>
          <div class="channels">
            <div class="channel" style="--a:var(--flare)"><div class="orb"></div><div><b>Flare</b><span>1</span><div class="pips"><i class="pip"></i><i class="pip"></i><i class="pip"></i><i class="pip"></i></div></div></div>
            <div class="channel" style="--a:var(--radiance)"><div class="orb"></div><div><b>Radiance</b><span>1</span><div class="pips"><i class="pip"></i><i class="pip"></i><i class="pip"></i><i class="pip"></i></div></div></div>
            <div class="channel" style="--a:var(--verdance)"><div class="orb"></div><div><b>Verdance</b><span>0</span><div class="pips"><i class="pip"></i><i class="pip"></i><i class="pip"></i><i class="pip"></i></div></div></div>
            <div class="channel" style="--a:var(--continuum)"><div class="orb"></div><div><b>Continuum</b><span>1</span><div class="pips"><i class="pip"></i><i class="pip"></i><i class="pip"></i><i class="pip"></i></div></div></div>
            <div class="channel" style="--a:var(--abyss)"><div class="orb"></div><div><b>Abyss</b><span>0</span><div class="pips"><i class="pip"></i><i class="pip"></i><i class="pip"></i><i class="pip"></i></div></div></div>
            <div class="channel" style="--a:var(--singularity)"><div class="orb"></div><div><b>Singularity</b><span>0</span><div class="pips"><i class="pip"></i><i class="pip"></i><i class="pip"></i></div></div></div>
          </div>
          <div class="harness"><span>Select 3 different or 2 matching</span><button>Harness</button></div>
        </section>

        <nav class="nav" aria-label="Views">
          <div>Board</div>
          <div>Civ</div>
          <div>Log</div>
        </nav>
      </aside>
    </section>
  </main>
</body>
</html>
