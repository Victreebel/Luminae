kind = "web"
previewPath = "/"
title = "Luminae"
version = "1.0.0"
id = "artifacts/luminae"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18882

[services.development]
run = "pnpm --filter @workspace/luminae run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/luminae", "run", "build" ]
publicDir = "artifacts/luminae/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18882"
BASE_PATH = "/"
