<!doctype html><html lang="en"><meta charset="utf-8"><title>Insignia anchors</title><style>body{margin:0;background:#151919;color:#efe8db;font:16px system-ui;padding:36px}h1{font-size:22px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.cell{border:1px solid #3b4140;padding:12px;text-align:center;border-radius:8px}.large{width:100%;max-width:250px;height:250px;object-fit:contain}.small{display:flex;gap:20px;justify-content:center;align-items:center;height:64px}.small img{object-fit:contain}.light{background:#eae4d9;color:#1a2020}.light img{filter:brightness(0)}button{padding:10px;margin-bottom:20px}</style><h1>Carved silhouettes — reference marks</h1><button onclick="document.body.classList.toggle('light')">Light / dark</button><div class="grid"><div class="cell"><img class="large" src="vortex.png" alt="vortex"><h2>Vortex</h2><div class="small"><img src="vortex.png" width="48" height="48" alt="48 pixels"><img src="vortex.png" width="24" height="24" alt="24 pixels"></div></div><div class="cell"><img class="large" src="chrysalis.png" alt="chrysalis"><h2>Chrysalis</h2><div class="small"><img src="chrysalis.png" width="48" height="48" alt="48 pixels"><img src="chrysalis.png" width="24" height="24" alt="24 pixels"></div></div><div class="cell"><img class="large" src="ouroboros.png" alt="ouroboros"><h2>Ouroboros</h2><div class="small"><img src="ouroboros.png" width="48" height="48" alt="48 pixels"><img src="ouroboros.png" width="24" height="24" alt="24 pixels"></div></div><div class="cell"><img class="large" src="mycelium.png" alt="mycelium"><h2>Mycelium</h2><div class="small"><img src="mycelium.png" width="48" height="48" alt="48 pixels"><img src="mycelium.png" width="24" height="24" alt="24 pixels"></div></div></div></html>
