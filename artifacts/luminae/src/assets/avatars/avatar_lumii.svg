<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Lumii</title>
  <desc id="desc">A constellation of six colored Affinity lights.</desc>
  <defs>
    <radialGradient id="field" cx="50%" cy="46%" r="66%">
      <stop offset="0" stop-color="#141637"/>
      <stop offset="0.58" stop-color="#080b22"/>
      <stop offset="1" stop-color="#03040f"/>
    </radialGradient>
    <filter id="glow" x="-180%" y="-180%" width="460%" height="460%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="128" height="128" rx="64" fill="url(#field)"/>
  <g opacity="0.45" fill="#dbeafe">
    <circle cx="28" cy="24" r="1.4"/>
    <circle cx="102" cy="29" r="1"/>
    <circle cx="111" cy="77" r="1.3"/>
    <circle cx="22" cy="103" r="1"/>
  </g>
  <g fill="none" stroke-linecap="round" stroke-width="2" opacity="0.55">
    <path d="M64 28 91 48 85 86 55 96 33 73 41 43 64 28" stroke="#7183cf"/>
    <path d="M64 28 55 96" stroke="#9074cf" opacity="0.62"/>
  </g>
  <g filter="url(#glow)">
    <circle cx="64" cy="28" r="5" fill="#f97316"/>
    <circle cx="91" cy="48" r="5" fill="#3b82f6"/>
    <circle cx="85" cy="86" r="5" fill="#22c55e"/>
    <circle cx="55" cy="96" r="5" fill="#a855f7"/>
    <circle cx="33" cy="73" r="5" fill="#fbbf24"/>
    <circle cx="41" cy="43" r="5" fill="#e2e8f0"/>
  </g>
  <g fill="#fff" opacity="0.75">
    <circle cx="108" cy="57" r="2.6"/>
    <circle cx="18" cy="83" r="2.2" fill="#c084fc"/>
  </g>
</svg>
