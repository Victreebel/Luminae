<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Lumii</title>
  <desc id="desc">A constellation of five colored natural-Affinity lights around a white core.</desc>
  <defs>
    <radialGradient id="field" cx="50%" cy="46%" r="66%">
      <stop offset="0" stop-color="#141637"/>
      <stop offset="0.58" stop-color="#080b22"/>
      <stop offset="1" stop-color="#03040f"/>
    </radialGradient>
    <filter id="glow" x="-180%" y="-180%" width="460%" height="460%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="128" height="128" rx="64" fill="url(#field)"/>
  <g opacity="0.45" fill="#dbeafe">
    <circle cx="28" cy="24" r="1.4"/>
    <circle cx="102" cy="29" r="1"/>
    <circle cx="111" cy="77" r="1.3"/>
    <circle cx="22" cy="103" r="1"/>
  </g>
  <g fill="none" stroke-linecap="round" stroke-width="2" opacity="0.55">
    <path d="M64 28 93 52 82 91 46 91 35 52 64 28" stroke="#7183cf"/>
    <path d="M64 28 46 91" stroke="#9074cf" opacity="0.62"/>
  </g>
  <g filter="url(#glow)" data-lumii-node-count="5">
    <circle data-lumii-node="flare" cx="64" cy="28" r="5" fill="#FF5A3C"/>
    <circle data-lumii-node="continuum" cx="93" cy="52" r="5" fill="#3D6BFF"/>
    <circle data-lumii-node="verdance" cx="82" cy="91" r="5" fill="#2ECC71"/>
    <circle data-lumii-node="abyss" cx="46" cy="91" r="5" fill="#A832D4"/>
    <circle data-lumii-node="radiance" cx="35" cy="52" r="5" fill="#DFC878"/>
    <circle data-lumii-core-role="identity" cx="64" cy="64" r="4" fill="#ffffff"/>
  </g>
  <g fill="#fff" opacity="0.75">
    <circle cx="108" cy="57" r="2.6"/>
    <circle cx="18" cy="83" r="2.2" fill="#c084fc"/>
  </g>
</svg>
