<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" rx="80" fill="#0a0c14"/>
  <!-- outer glow ring -->
  <circle cx="256" cy="256" r="180" fill="url(#outerGlow)" opacity="0.25"/>
  <!-- gem body: octagonal faceted crystal -->
  <polygon points="256,90 360,160 390,256 360,352 256,422 152,352 122,256 152,160" fill="url(#gemGrad)"/>
  <!-- top facets -->
  <polygon points="256,90 360,160 256,200" fill="url(#topFacet)" opacity="0.9"/>
  <polygon points="256,90 152,160 256,200" fill="url(#topFacet2)" opacity="0.7"/>
  <!-- side facets -->
  <polygon points="360,160 390,256 320,230 256,200" fill="url(#rightFacet)" opacity="0.6"/>
  <polygon points="152,160 122,256 192,230 256,200" fill="url(#leftFacet)" opacity="0.5"/>
  <!-- center highlight -->
  <ellipse cx="256" cy="220" rx="55" ry="35" fill="white" opacity="0.12"/>
  <!-- inner gem core -->
  <circle cx="256" cy="256" r="65" fill="url(#coreGrad)" opacity="0.7"/>
  <!-- starburst spikes -->
  <line x1="256" y1="40"  x2="256" y2="80"  stroke="#a8c8ff" stroke-width="3" opacity="0.8"/>
  <line x1="256" y1="432" x2="256" y2="472" stroke="#a8c8ff" stroke-width="2" opacity="0.5"/>
  <line x1="80"  y1="256" x2="110" y2="256" stroke="#a8c8ff" stroke-width="2" opacity="0.5"/>
  <line x1="402" y1="256" x2="432" y2="256" stroke="#a8c8ff" stroke-width="3" opacity="0.7"/>
  <!-- diagonal spikes -->
  <line x1="145" y1="115" x2="165" y2="140" stroke="#c0d8ff" stroke-width="2" opacity="0.6"/>
  <line x1="367" y1="115" x2="347" y2="140" stroke="#c0d8ff" stroke-width="2.5" opacity="0.75"/>
  <defs>
    <radialGradient id="outerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6080ff"/>
      <stop offset="100%" stop-color="#0a0c14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gemGrad" x1="152" y1="90" x2="390" y2="422" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#8ab4ff"/>
      <stop offset="30%"  stop-color="#3d6bff"/>
      <stop offset="65%"  stop-color="#1a3aab"/>
      <stop offset="100%" stop-color="#0d1855"/>
    </linearGradient>
    <linearGradient id="topFacet" x1="256" y1="90" x2="310" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ccdeff"/>
      <stop offset="100%" stop-color="#5080ff" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="topFacet2" x1="256" y1="90" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a0c0ff"/>
      <stop offset="100%" stop-color="#2040cc" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="rightFacet" x1="390" y1="160" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5575dd"/>
      <stop offset="100%" stop-color="#1a2888" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="leftFacet" x1="122" y1="160" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3355cc"/>
      <stop offset="100%" stop-color="#0d1660" stop-opacity="0.5"/>
    </linearGradient>
    <radialGradient id="coreGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#8ab4ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1020a0" stop-opacity="0.2"/>
    </radialGradient>
  </defs>
</svg>
