openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Luminae multiplayer tabletop game API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: rooms
    description: Room management
  - name: game
    description: Game state and actions
  - name: auth
    description: Account authentication
  - name: friends
    description: Friends list and requests
  - name: challenges
    description: Player challenges
  - name: blueprints
    description: Blueprint clearance, ownership, and loadouts
  - name: store
    description: Cosmetic catalog and loadouts
  - name: architect-record
    description: First-contact continuity and sealed Archive progression
  - name: telemetry
    description: Allowlisted first-party product events

paths:
  /cards/lore:
    get:
      operationId: getCardLoreCatalog
      tags: [game]
      summary: Return name and flavour text for every card
      responses:
        "200":
          description: Card lore map keyed by card ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardLoreCatalog"

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /rooms:
    post:
      operationId: createRoom
      tags: [rooms]
      summary: Create a new game room
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoomBody"
      responses:
        "201":
          description: Room created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomWithPlayer"

  /rooms/{inviteCode}:
    get:
      operationId: getRoomByInviteCode
      tags: [rooms]
      summary: Get room info by invite code
      parameters:
        - name: inviteCode
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Room info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomInfo"
        "404":
          description: Room not found

  /rooms/{roomId}/join:
    post:
      operationId: joinRoom
      tags: [rooms]
      summary: Join a room
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinRoomBody"
      responses:
        "200":
          description: Joined room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomWithPlayer"
        "400":
          description: Cannot join room
        "404":
          description: Room not found

  /rooms/{roomId}/rejoin:
    post:
      operationId: rejoinRoom
      tags: [rooms]
      summary: Securely rotate an existing player's game session
      security:
        - accountToken: []
        - {}
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejoinRoomBody"
      responses:
        "200":
          description: Rejoined room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomWithPlayer"
        "404":
          description: No matching player

  /rooms/{roomId}/ai-players:
    post:
      operationId: addAiPlayer
      tags: [rooms]
      summary: Add an AI player to the room (host only)
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddAiPlayerBody"
      responses:
        "200":
          description: AI player added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomPlayer"
        "400":
          description: Cannot add AI player
        "403":
          description: Not the host

  /rooms/{roomId}/start:
    post:
      operationId: startGame
      tags: [rooms]
      summary: Start the game (host only)
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HostActionBody"
      responses:
        "200":
          description: Game started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameState"
        "400":
          description: Cannot start game
        "403":
          description: Not the host

  /rooms/{roomId}/rematch:
    post:
      operationId: rematch
      tags: [rooms]
      summary: Vote to restart the game, optionally replaying the same opening board
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RematchBody"
      responses:
        "200":
          description: Rematch vote recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RematchVoteResponse"
        "400":
          description: Game is not finished
        "403":
          description: Not the host

  /rooms/{roomId}/state:
    get:
      operationId: getGameState
      tags: [game]
      summary: Get current game state
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
        - name: sessionToken
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Game state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameState"
        "403":
          description: Not a member of this room
        "404":
          description: Room not found

  /rooms/{roomId}/actions:
    post:
      operationId: submitAction
      tags: [game]
      summary: Submit a turn action
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActionRequest"
      responses:
        "200":
          description: Action applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameState"
        "400":
          description: Invalid action
        "403":
          description: Not your turn

  /rooms/{roomId}/players/{playerId}:
    delete:
      operationId: kickPlayer
      tags: [rooms]
      summary: Kick a player (host only)
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
        - name: playerId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HostActionBody"
      responses:
        "200":
          description: Player kicked
        "403":
          description: Not the host
        "404":
          description: Player not found

  /rooms/{roomId}/quit:
    post:
      operationId: quitRoom
      tags: [rooms]
      summary: Quit / forfeit a game
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuitRoomBody"
      responses:
        "200":
          description: Quit successfully
        "403":
          description: Not a member
        "404":
          description: Room not found

  /auth/register:
    post:
      operationId: registerAccount
      tags: [auth]
      summary: Create a new account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterBody"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountWithToken"
        "400":
          description: Validation error
        "409":
          description: Username or email already taken

  /auth/login:
    post:
      operationId: loginAccount
      tags: [auth]
      summary: Sign in to an existing account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountWithToken"
        "401":
          description: Invalid credentials

  /auth/logout:
    post:
      operationId: logoutAccount
      tags: [auth]
      summary: Invalidate the current account session
      security:
        - accountToken: []
      responses:
        "200":
          description: Logged out

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get the current account with active rooms
      security:
        - accountToken: []
      responses:
        "200":
          description: Current account with active rooms
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetMeResponse"
        "401":
          description: Unauthorized

  /auth/me/civilization-identity:
    put:
      operationId: updateCivilizationIdentity
      tags: [auth]
      summary: Confirm the account's earned public civilization identity
      security:
        - accountToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CivilizationIdentitySelection"
      responses:
        "200":
          description: Confirmed civilization identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CivilizationIdentityUpdateResponse"
        "400":
          description: Invalid identity selection
        "403":
          description: One or more identity choices have not been earned

  /campaigns/architect-record:
    get:
      operationId: getArchitectRecord
      tags: [architect-record]
      summary: Fetch the account's redacted Architect Record
      security:
        - accountToken: []
      responses:
        "200":
          description: Redacted Architect Record state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchitectRecordState"

  /campaigns/architect-record/onboarding-claim:
    post:
      operationId: claimArchitectRecordOnboarding
      tags: [architect-record]
      summary: Idempotently claim a completed first-contact tutorial
      security:
        - accountToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingClaimBody"
      responses:
        "200":
          description: Updated Architect Record state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchitectRecordState"

  /campaigns/architect-record/presentations/{presentationId}/acknowledge:
    post:
      operationId: acknowledgeArchitectRecordPresentation
      tags: [architect-record]
      summary: Idempotently acknowledge a saved Architect Record presentation
      security:
        - accountToken: []
      parameters:
        - name: presentationId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Presentation acknowledged
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required: [ok]

  /campaigns/architect-record/qualifying-match:
    post:
      operationId: createOrResumeQualifyingMatch
      tags: [architect-record]
      summary: Create or resume a standard 15-Eminence match against three Hard AIs
      security:
        - accountToken: []
      responses:
        "200":
          description: Existing qualifying match resumed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QualifyingMatchSession"
        "201":
          description: New qualifying match created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QualifyingMatchSession"

  /events/first-party:
    post:
      operationId: recordFirstPartyEvent
      tags: [telemetry]
      summary: Accept an allowlisted event with fixed, non-personal dimensions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FirstPartyEventBody"
      responses:
        "202":
          description: Event accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted:
                    type: boolean
                required: [accepted]

  /blueprints/vault:
    get:
      operationId: getBlueprintVault
      tags: [blueprints]
      summary: Get owner-private Blueprint clearance, ownership, loadouts, and mastery
      security:
        - accountToken: []
      responses:
        "200":
          description: Owner-private Vault state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlueprintVaultResponse"

  /blueprints/vault/threshold:
    post:
      operationId: updateBlueprintVaultThreshold
      tags: [blueprints]
      summary: Idempotently record the Supreme Cipher, encounter approach, and dialogue memory
      security:
        - accountToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlueprintVaultThresholdBody"
      responses:
        "200":
          description: Threshold state recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlueprintVaultThresholdResult"
        "409":
          description: Conflicting approach or invalid threshold order

  /blueprints/vault/decryption-key:
    post:
      operationId: useBlueprintVaultDecryptionKey
      tags: [blueprints]
      summary: Consume a Black Market Decryption Key for one Vault access attempt
      security:
        - accountToken: []
      responses:
        "200":
          description: Temporary Vault access granted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlueprintDecryptionKeyUseResult"
        "403":
          description: No decryption key is available
        "409":
          description: The key is unnecessary or the defense forecast is active

  /blueprints/clearance-challenge:
    post:
      operationId: startBlueprintClearanceChallenge
      tags: [blueprints]
      summary: Idempotently start or resume the Lumii clearance scenario
      security:
        - accountToken: []
      responses:
        "200":
          description: Existing challenge resumed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlueprintChallengeSession"
        "201":
          description: New challenge created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlueprintChallengeSession"

  /blueprints/clearance-challenge/withdraw:
    post:
      operationId: withdrawBlueprintClearanceChallenge
      tags: [blueprints]
      summary: Idempotently withdraw from the active Lumii clearance scenario
      security:
        - accountToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                roomId:
                  type: string
              required:
                - roomId
      responses:
        "200":
          description: Challenge withdrawn without recording a match result
          content:
            application/json:
              schema:
                type: object
                properties:
                  roomId:
                    type: string
                  status:
                    type: string
                    enum: [classified, challenge_ready]
                required:
                  - roomId
                  - status

  /blueprints/vault/reveal-ack:
    post:
      operationId: acknowledgeBlueprintVaultReveal
      tags: [blueprints]
      summary: Mark the completed Vault opening as seen
      security:
        - accountToken: []
      responses:
        "200":
          description: Reveal acknowledged
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                  - ok

  /blueprints/loadouts/{mode}:
    put:
      operationId: updateBlueprintLoadout
      tags: [blueprints]
      summary: Replace the two Blueprint slots for one supported mode
      security:
        - accountToken: []
      parameters:
        - name: mode
          in: path
          required: true
          schema:
            type: string
            enum: [campaign, custom, competitive]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlueprintLoadoutBody"
      responses:
        "200":
          description: Updated loadout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlueprintLoadout"

  /cosmetics/loadout:
    put:
      operationId: updateCosmeticLoadout
      tags: [store]
      summary: Equip or clear one scoped cosmetic slot
      security:
        - accountToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CosmeticLoadoutBody"
      responses:
        "200":
          description: Updated lightweight cosmetic loadout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CosmeticLoadoutResponse"

  /auth/me/games:
    get:
      operationId: getMyGames
      tags: [auth]
      summary: List active (non-finished) games for the current account
      security:
        - accountToken: []
      responses:
        "200":
          description: List of active games
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveGamesResponse"
        "401":
          description: Unauthorized

  /auth/me/stats:
    get:
      operationId: getMyStats
      tags: [auth]
      summary: Get lifetime stats and game history for the current account
      security:
        - accountToken: []
      responses:
        "200":
          description: Lifetime stats and recent game history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerStatsResponse"
        "401":
          description: Unauthorized

  /friends:
    get:
      operationId: listFriends
      tags: [friends]
      summary: List accepted friends with online status
      security:
        - accountToken: []
      responses:
        "200":
          description: Friends list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendsListResponse"

  /friends/requests:
    get:
      operationId: listFriendRequests
      tags: [friends]
      summary: List incoming pending friend requests
      security:
        - accountToken: []
      responses:
        "200":
          description: Incoming requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendRequestsResponse"
    post:
      operationId: sendFriendRequest
      tags: [friends]
      summary: Send a friend request by username
      security:
        - accountToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendFriendRequestBody"
      responses:
        "201":
          description: Request sent
        "404":
          description: User not found
        "409":
          description: Already friends or request pending

  /friends/requests/{id}:
    patch:
      operationId: respondToFriendRequest
      tags: [friends]
      summary: Accept or decline a friend request
      security:
        - accountToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FriendRequestActionBody"
      responses:
        "200":
          description: Request updated
        "404":
          description: Request not found

  /friends/{id}:
    delete:
      operationId: removeFriend
      tags: [friends]
      summary: Remove a friend
      security:
        - accountToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Unfriended
        "404":
          description: Friendship not found

  /challenges:
    get:
      operationId: listChallenges
      tags: [challenges]
      summary: List incoming pending challenges
      security:
        - accountToken: []
      responses:
        "200":
          description: Pending challenges
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengesResponse"
    post:
      operationId: createChallenge
      tags: [challenges]
      summary: Challenge a friend to a game
      security:
        - accountToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChallengeBody"
      responses:
        "201":
          description: Challenge created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeCreatedResponse"
        "403":
          description: Not friends
        "404":
          description: User not found
        "409":
          description: Challenge already pending

  /challenges/{id}:
    patch:
      operationId: respondToChallenge
      tags: [challenges]
      summary: Accept or decline a challenge
      security:
        - accountToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChallengeActionBody"
      responses:
        "200":
          description: Challenge resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeAcceptedResponse"
        "404":
          description: Challenge not found
        "410":
          description: Challenge expired

components:
  securitySchemes:
    accountToken:
      type: http
      scheme: bearer
  schemas:
    CardLoreEntry:
      type: object
      properties:
        name:
          type: string
        flavor:
          type: string
        artifactForm:
          type: string
        blueprintRole:
          type: string
        blueprintFamilies:
          type: string
        civLane:
          type: string
        engineeringScale:
          type: string
          enum:
            - Planetary
            - Star-system
            - Galactic
        artPrompt:
          type: string
      required:
        - name
        - flavor

    CardLoreCatalog:
      type: object
      additionalProperties:
        $ref: "#/components/schemas/CardLoreEntry"

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    QuitRoomBody:
      type: object
      properties:
        sessionToken:
          type: string
      required:
        - sessionToken

    RegisterBody:
      type: object
      properties:
        username:
          type: string
          minLength: 2
          maxLength: 32
        password:
          type: string
          minLength: 6
        email:
          type: string
      required:
        - username
        - password

    LoginBody:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
        - username
        - password

    ActiveRoomEntry:
      type: object
      properties:
        roomId:
          type: string
        inviteCode:
          type: string
        status:
          type: string
          enum: [lobby, playing]
        sessionToken:
          type: string
        playerId:
          type: string
        isHost:
          type: boolean
        gameMode:
          $ref: "#/components/schemas/GameMode"
        scenarioId:
          type: ["string", "null"]
      required:
        - roomId
        - inviteCode
        - status
        - sessionToken
        - playerId
        - isHost
        - gameMode
        - scenarioId

    BlueprintClearanceSummary:
      type: object
      properties:
        qualifyingWins:
          type: integer
        requiredWins:
          type: integer
        status:
          type: string
          enum: [classified, challenge_ready, challenge_active, cleared]
        challengeRoomId:
          type: ["string", "null"]
        cipherDeactivated:
          type: boolean
        thresholdApproach:
          anyOf:
            - $ref: "#/components/schemas/LumiiThresholdApproach"
            - type: "null"
        thresholdDialoguePath:
          type: array
          items:
            $ref: "#/components/schemas/LumiiThresholdDialogueChoiceId"
        thresholdDialogueResolution:
          anyOf:
            - $ref: "#/components/schemas/LumiiThresholdDialogueResolution"
            - type: "null"
        covenantBroken:
          type: boolean
        decryptionKeyBypassActive:
          type: boolean
        revealPending:
          type: boolean
      required:
        - qualifyingWins
        - requiredWins
        - status
        - challengeRoomId
        - cipherDeactivated
        - thresholdApproach
        - thresholdDialoguePath
        - thresholdDialogueResolution
        - covenantBroken
        - decryptionKeyBypassActive
        - revealPending

    LumiiThresholdApproach:
      type: string
      enum: [kinship, inquiry, dominion]

    LumiiThresholdDialogueChoiceId:
      type: string
      enum:
        - kinship-want
        - kinship-fear
        - kinship-familiar
        - kinship-with-you
        - kinship-help
        - kinship-grow
        - inquiry-answer
        - inquiry-warning
        - inquiry-relation
        - inquiry-unsayable
        - inquiry-warning-against
        - inquiry-preserve
        - inquiry-risk
        - inquiry-pattern
        - dominion-decide
        - dominion-cipher
        - dominion-stand
        - dominion-stop
        - kinship-universe
        - kinship-difference
        - kinship-stop-why
        - kinship-unafraid
        - kinship-fear-change
