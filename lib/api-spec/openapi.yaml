          type: boolean
          description: Development-only lease held while the in-game Luminary Sequence Lab still has staged presentations to resolve
        artifactMarkers:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ArtifactMarker"
          description: Active Artifact markers keyed by cardId (v0.8 — Forgotten/Condemned/Nullified/AvatarSeed)
        nullifiedFirstForge:
          type: ["object", "null"]
          description: The first Nullified Artifact forged this game and whether the allied-player exemption applied.
