openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Luminae multiplayer tabletop game API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: rooms
    description: Room management
  - name: game
    description: Game state and actions
  - name: auth
    description: Account authentication
  - name: friends
    description: Friends list and requests
  - name: challenges
    description: Player challenges

paths:
  /cards/lore:
    get:
      operationId: getCardLoreCatalog
      tags: [game]
      summary: Return name and flavour text for every card
      responses:
        "200":
          description: Card lore map keyed by card ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardLoreCatalog"

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /rooms:
    post:
      operationId: createRoom
      tags: [rooms]
      summary: Create a new game room
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoomBody"
      responses:
        "201":
          description: Room created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomWithPlayer"

  /rooms/{inviteCode}:
    get:
      operationId: getRoomByInviteCode
      tags: [rooms]
      summary: Get room info by invite code
      parameters:
        - name: inviteCode
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Room info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomInfo"
        "404":
          description: Room not found

  /rooms/{roomId}/join:
    post:
      operationId: joinRoom
      tags: [rooms]
      summary: Join a room
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinRoomBody"
      responses:
        "200":
          description: Joined room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomWithPlayer"
        "400":
          description: Cannot join room
        "404":
          description: Room not found

  /rooms/{roomId}/rejoin:
    post:
      operationId: rejoinRoom
      tags: [rooms]
      summary: Reclaim an existing player slot in a room (works in any status)
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejoinRoomBody"
      responses:
        "200":
          description: Rejoined room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomWithPlayer"
        "404":
          description: No matching player

  /rooms/{roomId}/ai-players:
    post:
      operationId: addAiPlayer
      tags: [rooms]
      summary: Add an AI player to the room (host only)
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddAiPlayerBody"
      responses:
        "200":
          description: AI player added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomPlayer"
        "400":
          description: Cannot add AI player
        "403":
          description: Not the host

  /rooms/{roomId}/start:
    post:
      operationId: startGame
      tags: [rooms]
      summary: Start the game (host only)
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HostActionBody"
      responses:
        "200":
          description: Game started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameState"
        "400":
          description: Cannot start game
        "403":
          description: Not the host

  /rooms/{roomId}/rematch:
    post:
      operationId: rematch
      tags: [rooms]
      summary: Vote to restart the game, optionally replaying the same opening board
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RematchBody"
      responses:
        "200":
          description: Rematch vote recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RematchVoteResponse"
        "400":
          description: Game is not finished
        "403":
          description: Not the host

  /rooms/{roomId}/state:
    get:
      operationId: getGameState
      tags: [game]
      summary: Get current game state
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
        - name: sessionToken
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Game state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameState"
        "403":
          description: Not a member of this room
        "404":
          description: Room not found

  /rooms/{roomId}/actions:
    post:
      operationId: submitAction
      tags: [game]
      summary: Submit a turn action
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActionRequest"
      responses:
        "200":
          description: Action applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameState"
        "400":
          description: Invalid action
        "403":
          description: Not your turn

  /rooms/{roomId}/players/{playerId}:
    delete:
      operationId: kickPlayer
      tags: [rooms]
      summary: Kick a player (host only)
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
        - name: playerId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HostActionBody"
      responses:
        "200":
          description: Player kicked
        "403":
          description: Not the host
        "404":
          description: Player not found

  /rooms/{roomId}/quit:
    post:
      operationId: quitRoom
      tags: [rooms]
      summary: Quit / forfeit a game
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuitRoomBody"
      responses:
        "200":
          description: Quit successfully
        "403":
          description: Not a member
        "404":
          description: Room not found

  /auth/register:
    post:
      operationId: registerAccount
      tags: [auth]
      summary: Create a new account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterBody"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountWithToken"
        "400":
          description: Validation error
        "409":
          description: Username or email already taken

  /auth/login:
    post:
      operationId: loginAccount
      tags: [auth]
      summary: Sign in to an existing account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountWithToken"
        "401":
          description: Invalid credentials

  /auth/logout:
    post:
      operationId: logoutAccount
      tags: [auth]
      summary: Invalidate the current account session
      security:
        - accountToken: []
      responses:
        "200":
          description: Logged out

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get the current account with active rooms
      security:
        - accountToken: []
      responses:
        "200":
          description: Current account with active rooms
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetMeResponse"
        "401":
          description: Unauthorized

  /auth/me/games:
    get:
      operationId: getMyGames
      tags: [auth]
      summary: List active (non-finished) games for the current account
      security:
        - accountToken: []
      responses:
        "200":
          description: List of active games
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveGamesResponse"
        "401":
          description: Unauthorized

  /auth/me/stats:
    get:
      operationId: getMyStats
      tags: [auth]
      summary: Get lifetime stats and game history for the current account
      security:
        - accountToken: []
      responses:
        "200":
          description: Lifetime stats and recent game history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerStatsResponse"
        "401":
          description: Unauthorized

  /friends:
    get:
      operationId: listFriends
      tags: [friends]
      summary: List accepted friends with online status
      security:
        - accountToken: []
      responses:
        "200":
          description: Friends list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendsListResponse"

  /friends/requests:
    get:
      operationId: listFriendRequests
      tags: [friends]
      summary: List incoming pending friend requests
      security:
        - accountToken: []
      responses:
        "200":
          description: Incoming requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendRequestsResponse"
    post:
      operationId: sendFriendRequest
      tags: [friends]
      summary: Send a friend request by username
      security:
        - accountToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendFriendRequestBody"
      responses:
        "201":
          description: Request sent
        "404":
          description: User not found
        "409":
          description: Already friends or request pending

  /friends/requests/{id}:
    patch:
      operationId: respondToFriendRequest
      tags: [friends]
      summary: Accept or decline a friend request
      security:
        - accountToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FriendRequestActionBody"
      responses:
        "200":
          description: Request updated
        "404":
          description: Request not found

  /friends/{id}:
    delete:
      operationId: removeFriend
      tags: [friends]
      summary: Remove a friend
      security:
        - accountToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Unfriended
        "404":
          description: Friendship not found

  /challenges:
    get:
      operationId: listChallenges
      tags: [challenges]
      summary: List incoming pending challenges
      security:
        - accountToken: []
      responses:
        "200":
          description: Pending challenges
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengesResponse"
    post:
      operationId: createChallenge
      tags: [challenges]
      summary: Challenge a friend to a game
      security:
        - accountToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChallengeBody"
      responses:
        "201":
          description: Challenge created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeCreatedResponse"
        "403":
          description: Not friends
        "404":
          description: User not found
        "409":
          description: Challenge already pending

  /challenges/{id}:
    patch:
      operationId: respondToChallenge
      tags: [challenges]
      summary: Accept or decline a challenge
      security:
        - accountToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChallengeActionBody"
      responses:
        "200":
          description: Challenge resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeAcceptedResponse"
        "404":
          description: Challenge not found
        "410":
          description: Challenge expired

components:
  securitySchemes:
    accountToken:
      type: http
      scheme: bearer
  schemas:
    CardLoreEntry:
      type: object
      properties:
        name:
          type: string
        flavor:
          type: string
        artifactForm:
          type: string
        blueprintRole:
          type: string
        blueprintFamilies:
          type: string
        civLane:
          type: string
        engineeringScale:
          type: string
          enum:
            - Planetary
            - Star-system
            - Galactic
        artPrompt:
          type: string
      required:
        - name
        - flavor

    CardLoreCatalog:
      type: object
      additionalProperties:
        $ref: "#/components/schemas/CardLoreEntry"

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    QuitRoomBody:
      type: object
      properties:
        sessionToken:
          type: string
      required:
        - sessionToken

    RegisterBody:
      type: object
      properties:
        username:
          type: string
          minLength: 2
          maxLength: 32
        password:
          type: string
          minLength: 6
        email:
          type: string
      required:
        - username
        - password

    LoginBody:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
        - username
        - password

    ActiveRoomEntry:
      type: object
      properties:
        roomId:
          type: string
        inviteCode:
          type: string
        status:
          type: string
          enum: [lobby, playing]
        sessionToken:
          type: string
        playerId:
          type: string
        isHost:
          type: boolean
      required:
        - roomId
        - inviteCode
        - status
        - sessionToken
        - playerId
        - isHost

    AccountInfo:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        email:
          type: ["string", "null"]
        createdAt:
          type: string
      required:
        - id
        - username

    GetMeResponse:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        email:
          type: ["string", "null"]
        createdAt:
          type: string
        activeRooms:
          type: array
          items:
            $ref: "#/components/schemas/ActiveRoomEntry"
      required:
        - id
        - username
        - activeRooms

    AccountWithToken:
      type: object
      properties:
        account:
          $ref: "#/components/schemas/AccountInfo"
        token:
          type: string
        expiresAt:
          type: string
      required:
        - account
        - token
        - expiresAt

    ActiveGame:
      type: object
      properties:
        roomId:
          type: string
        inviteCode:
          type: string
        status:
          type: string
          enum: [lobby, playing]
        maxPlayers:
          type: integer
        currentPlayers:
          type: integer
        updatedAt:
          type: string
        sessionToken:
          type: string
        playerId:
          type: string
        isHost:
          type: boolean
        playerName:
          type: string
        avatarId:
          type: ["string", "null"]
      required:
        - roomId
        - inviteCode
        - status
        - maxPlayers
        - currentPlayers
        - updatedAt
        - sessionToken
        - playerId
        - isHost
        - playerName

    ActiveGamesResponse:
      type: object
      properties:
        games:
          type: array
          items:
            $ref: "#/components/schemas/ActiveGame"
      required:
        - games

    GameHistoryEntry:
      type: object
      properties:
        roomId:
          type: string
        inviteCode:
          type: string
        finishedAt:
          type: string
          description: ISO timestamp when the game finished (room updatedAt)
        result:
          type: string
          enum: [win, loss, tie]
        eminenceEarned:
          type: integer
          description: Eminence (eminence) earned by the player in this game
        totalPlayers:
          type: integer
          description: Number of human players in the game
      required:
        - roomId
        - inviteCode
        - finishedAt
        - result
        - eminenceEarned
        - totalPlayers

    PlayerStatsResponse:
      type: object
      properties:
        gamesPlayed:
          type: integer
        wins:
          type: integer
        losses:
          type: integer
        ties:
          type: integer
        avgEminence:
          type: number
          format: float
          description: Average Eminence earned across all finished games
        recentGames:
          type: array
          items:
            $ref: "#/components/schemas/GameHistoryEntry"
          description: Most recent finished games, newest first (up to 20)
      required:
        - gamesPlayed
        - wins
        - losses
        - ties
        - avgEminence
        - recentGames

    FriendEntry:
      type: object
      properties:
        friendshipId:
          type: string
        accountId:
          type: string
        username:
          type: string
        isOnline:
          type: boolean
      required:
        - friendshipId
        - accountId
        - username
        - isOnline

    FriendsListResponse:
      type: object
      properties:
        friends:
          type: array
          items:
            $ref: "#/components/schemas/FriendEntry"
      required:
        - friends

    FriendRequestEntry:
      type: object
      properties:
        id:
          type: string
        from:
          type: object
          properties:
            accountId:
              type: string
            username:
              type: string
          required:
            - accountId
            - username
        createdAt:
          type: string
      required:
        - id
        - from
        - createdAt

    FriendRequestsResponse:
      type: object
      properties:
        requests:
          type: array
          items:
            $ref: "#/components/schemas/FriendRequestEntry"
      required:
        - requests

    SendFriendRequestBody:
      type: object
      properties:
        username:
          type: string
      required:
        - username

    FriendRequestActionBody:
      type: object
      properties:
        action:
          type: string
          enum: [accept, decline]
      required:
        - action

    ChallengeEntry:
      type: object
      properties:
        id:
          type: string
        challengerUsername:
          type: string
        challengerAccountId:
          type: string
        roomId:
          type: string
        inviteCode:
          type: string
        expiresAt:
          type: string
      required:
        - id
        - challengerUsername
        - challengerAccountId
        - roomId
        - inviteCode
        - expiresAt

    ChallengesResponse:
      type: object
      properties:
        challenges:
          type: array
          items:
            $ref: "#/components/schemas/ChallengeEntry"
      required:
        - challenges

    CreateChallengeBody:
      type: object
      properties:
        challengedUsername:
          type: string
        maxPlayers:
          type: integer
          minimum: 2
          maximum: 4
        victoryRequirement:
          type: integer
          enum: [15, 20, 25]
          description: Eminence required to trigger the final round
        cinematicMode:
          type: string
          enum: [standard, epic]
          description: Luminary cinematic presentation mode
        turnTimerSeconds:
          type: ["integer", "null"]
      required:
        - challengedUsername

    ChallengeCreatedResponse:
      type: object
      properties:
        id:
          type: string
        roomId:
          type: string
        inviteCode:
          type: string
        challengedUsername:
          type: string
        expiresAt:
          type: string
        sessionToken:
          type: string
        playerId:
          type: string
      required:
        - id
        - roomId
        - inviteCode
        - challengedUsername
        - expiresAt
        - sessionToken
        - playerId

    ChallengeActionBody:
      type: object
      properties:
        action:
          type: string
          enum: [accept, decline]
      required:
        - action

    ChallengeAcceptedResponse:
      type: object
      properties:
        ok:
          type: boolean
        resolution:
          type: string
        sessionToken:
          type: string
        room:
          type: object
          properties:
            id:
              type: string
            inviteCode:
              type: string
            status:
              type: string
            maxPlayers:
              type: integer
            turnTimerSeconds:
              type: ["integer", "null"]
          required:
            - id
            - inviteCode
            - status
            - maxPlayers
        player:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            isHost:
              type: boolean
          required:
            - id
            - name
            - isHost
      required:
        - ok
        - resolution

    CreateRoomBody:
      type: object
      properties:
        hostName:
          type: string
        maxPlayers:
          type: integer
          minimum: 2
          maximum: 4
        victoryRequirement:
          type: integer
          enum: [15, 20, 25]
          description: Eminence required to trigger the final round
        cinematicMode:
          type: string
          enum: [standard, epic]
          description: Luminary cinematic presentation mode
        turnTimerSeconds:
          type: ["integer", "null"]
          description: Optional per-turn time limit in seconds (null = no timer)
        avatarId:
          type: ["string", "null"]
          description: Avatar identifier chosen by the host
      required:
        - hostName
        - maxPlayers

    JoinRoomBody:
      type: object
      properties:
        playerName:
          type: string
        avatarId:
          type: ["string", "null"]
          description: Avatar identifier chosen by the joining player
      required:
        - playerName

    RejoinRoomBody:
      type: object
      properties:
        playerName:
          type: string
      required:
        - playerName

    HostActionBody:
      type: object
      properties:
        sessionToken:
          type: string
      required:
        - sessionToken

    RematchBody:
      type: object
      properties:
        sessionToken:
          type: string
        sameBoard:
          type: boolean
          description: When true, the next rematch reuses the original opening Forge, deck, Luminary, and first-player setup when available.
      required:
        - sessionToken

    RematchVoteResponse:
      type: object
      properties:
        voterIds:
          type: array
          items:
            type: string
        sameBoard:
          type: boolean
        countdownEndsAt:
          type: ["integer", "null"]
        sessionStats:
          type: object
          additionalProperties:
            type: object
            properties:
              wins:
                type: integer
              losses:
                type: integer
              ties:
                type: integer
              playerName:
                type: string
            required:
              - wins
              - losses
              - ties
              - playerName
      required:
        - voterIds
        - sameBoard
        - countdownEndsAt
        - sessionStats

    AddAiPlayerBody:
      type: object
      properties:
        sessionToken:
          type: string
        difficulty:
          type: string
          enum: [easy, medium, hard, passive]
      required:
        - sessionToken
        - difficulty

    RoomPlayer:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        isHost:
          type: boolean
        isConnected:
          type: boolean
        orderIndex:
          type: integer
        isAi:
          type: boolean
        aiDifficulty:
          type: ["string", "null"]
          enum: [easy, medium, hard, null]
        avatarId:
          type: ["string", "null"]
      required:
        - id
        - name
        - isHost
        - isConnected
        - orderIndex
        - isAi

    RoomInfo:
      type: object
      properties:
        id:
          type: string
        inviteCode:
          type: string
        status:
          type: string
          enum: [lobby, playing, finished]
        maxPlayers:
          type: integer
        victoryRequirement:
          type: integer
          description: Eminence required to trigger the final round
        cinematicMode:
          type: string
          enum: [standard, epic]
        turnTimerSeconds:
          type: ["integer", "null"]
        players:
          type: array
          items:
            $ref: "#/components/schemas/RoomPlayer"
      required:
        - id
        - inviteCode
        - status
        - maxPlayers
        - victoryRequirement
        - cinematicMode
        - players

    RoomWithPlayer:
      type: object
      properties:
        room:
          $ref: "#/components/schemas/RoomInfo"
        player:
          $ref: "#/components/schemas/RoomPlayer"
        sessionToken:
          type: string
      required:
        - room
        - player
        - sessionToken

    AffinityCounts:
      type: object
      description: A complete set of Luminae Affinity counts.
      properties:
        flare:
          type: integer
        continuum:
          type: integer
        verdance:
          type: integer
        abyss:
          type: integer
        radiance:
          type: integer
        singularity:
          type: integer
      required:
        - flare
        - continuum
        - verdance
        - abyss
        - radiance
        - singularity

    ArtifactCard:
      type: object
      properties:
        id:
          type: string
        tier:
          type: integer
        bonusAffinity:
          type: string
          enum: [flare, continuum, verdance, abyss, radiance]
        eminence:
          type: integer
        cost:
          $ref: "#/components/schemas/AffinityCounts"
        name:
          type: string
        flavor:
          type: string
        bonusesAtForge:
          $ref: "#/components/schemas/AffinityCounts"
          description: "Snapshot of the player's effective Affinity bonuses at the moment this Artifact was forged. Present only on forged Artifacts; absent on Forge or reserved Artifacts and on Artifacts forged before this feature was added."
      required:
        - id
        - tier
        - bonusAffinity
        - eminence
        - cost
        - name
        - flavor

    BurnEvent:
      type: object
      description: A single Artifact Burned by a Luminary effect, including its final destination
      properties:
        eventId:
          type: string
          description: Stable event identifier used to correlate one Burn across state updates and animation
        cardId:
          type: string
        artifactName:
          type: string
          description: Artifact name captured when the Burn resolved
        tier:
          type: integer
          enum: [1, 2, 3]
        sourceType:
          type: string
          enum: [luminary, action, system]
        sourceLuminaryId:
          type: string
        sourceName:
          type: string
        ownerPlayerId:
          type: string
        triggeredByPlayerId:
          type: string
        destination:
          type: string
          enum: [burn_pile, archive]
          description: Final destination after the Burn resolves; Eternal Recurrence redirects to archive
        turn:
          type: integer
          description: turnCount at the time of the burn
      required:
        - eventId
        - cardId
        - artifactName
        - tier
        - sourceType
        - sourceLuminaryId
        - destination
        - turn

    ActionLogEntry:
      type: object
      properties:
        playerId:
          type: string
        playerName:
          type: string
        summary:
          type: string
        turn:
          type: integer
      required:
        - playerId
        - playerName
        - summary
        - turn

    Luminary:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        domain:
          type: string
          description: Cosmic domain or element of this Luminary (e.g. Flame, Time, Stars)
        eminence:
          type: integer
        oblivion:
          type: integer
          description: >
            Oblivion penalty — when this Luminary is claimed, ALL players lose this
            many Eminence. Mutually exclusive with a positive eminence award.
            Omitted (or 0) on normal Eminence Luminaries.
        requirements:
          $ref: "#/components/schemas/AffinityCounts"
        flavor:
          type: string
          description: Short lore/flavor text shown on the Luminary card
        summonColor:
          type: string
          description: Primary hex color used for glow and aura effects
        summonSecondaryColor:
          type: string
          description: Secondary hex color used for aura gradient
        auraStyle:
          type: string
          description: Named aura style for the summoning cutscene
        effectName:
          type: string
          description: Short display name for this Luminary's special effect
        effectDescription:
          type: string
          description: Plain-English description of this Luminary's special effect for players
      required:
        - id
        - name
        - domain
        - eminence
        - requirements
        - flavor
        - summonColor
        - summonSecondaryColor
        - auraStyle

    GamePlayerState:
      type: object
      properties:
        playerId:
          type: string
        playerName:
          type: string
        avatarId:
          type: ["string", "null"]
        isAi:
          type: boolean
          description: Whether this player is an AI
        aiDifficulty:
          type: ["string", "null"]
          enum: [easy, medium, hard, null]
          description: AI difficulty level, null for human players or easy AI that never toggles
        affinities:
          $ref: "#/components/schemas/AffinityCounts"
        bonuses:
          $ref: "#/components/schemas/AffinityCounts"
        eminence:
          type: integer
        reservedArtifacts:
          type: array
          items:
            $ref: "#/components/schemas/ArtifactCard"
        forgedArtifactIds:
          type: array
          items:
            type: string
        discountedForgeIds:
          type: array
          items:
            type: string
          description: Artifact IDs forged with zero Affinities spent (fully covered by bonuses at forge time)
        forgedArtifacts:
          type: array
          items:
            $ref: "#/components/schemas/ArtifactCard"
        isConnected:
          type: boolean
        claimedLuminaryIds:
          type: array
          items:
            type: string
          description: IDs of luminaries this player has claimed
        plannedAction:
          type: ["object", "null"]
          additionalProperties: true
          description: Pre-committed action to auto-execute when this player's turn arrives
        plannedActionCancelReason:
          type: ["string", "null"]
          description: Reason the last planned action was auto-cancelled, if applicable
        civName:
          type: ["string", "null"]
          description: Player-chosen civilization name; null if not set
      required:
        - playerId
        - playerName
        - avatarId
        - isAi
        - aiDifficulty
        - affinities
        - bonuses
        - eminence
        - reservedArtifacts
        - forgedArtifactIds
        - discountedForgeIds
        - forgedArtifacts
        - isConnected
        - claimedLuminaryIds
        - plannedAction
        - plannedActionCancelReason
        - civName

    LuminaryActiveState:
      type: object
      properties:
        luminaryId:
          type: string
        ownerId:
          type: string
        activeAffinity:
          type: string
          enum: [flare, continuum, verdance, abyss, radiance]
        eligibleAffinities:
          type: array
          items:
            type: string
            enum: [flare, continuum, verdance, abyss, radiance]
        summonedAtTurnCount:
          type: integer
      required:
        - luminaryId
        - ownerId
        - activeAffinity
        - eligibleAffinities
        - summonedAtTurnCount

    PendingSummonEvent:
      type: object
      properties:
        eventId:
          type: string
        luminaryId:
          type: string
        claimedByPlayerId:
          type: string
        createdAt:
          type: integer
          description: Unix ms timestamp when this event was created; optional for backward compat
      required:
        - eventId
        - luminaryId
        - claimedByPlayerId

    PendingLuminaryActivationEvent:
      type: object
      description: An activation event queued for the short (~4s) per-effect cinematic overlay
      properties:
        eventId:
          type: string
        luminaryId:
          type: string
        effectType:
          type: string
          enum: [summon, end_of_turn, start_of_turn]
          description: Which hook fired this event
        triggeringPlayerId:
          type: string
          description: Player ID who owns the Luminary
        createdAt:
          type: integer
          description: Unix ms timestamp when this event was created; optional for backward compat
        targetCardIds:
          type: array
          items:
            type: string
          description: Artifact IDs targeted by this activation (e.g. condemned Artifacts for start_of_turn burn). Captured server-side before state mutations clear artifactMarkers.
      required:
        - eventId
        - luminaryId
        - effectType
        - triggeringPlayerId

    ArtifactMarkerType:
      type: string
      enum: [forgotten, condemned, nullified, avatar_seed]

    ArtifactBrand:
      type: object
      description: One persistent Luminary brand carried by an Artifact
      properties:
        type:
          $ref: "#/components/schemas/ArtifactMarkerType"
        ownerId:
          type: string
        summonedAtTurnCount:
          type: integer
      required:
        - type
        - ownerId
        - summonedAtTurnCount

    ArtifactMarker:
      allOf:
        - $ref: "#/components/schemas/ArtifactBrand"
        - type: object
          description: Persistent brands carried by an Artifact. Top-level fields mirror the newest brand for backward compatibility.
          properties:
            brands:
              type: array
              items:
                $ref: "#/components/schemas/ArtifactBrand"

    GameState:
      type: object
      properties:
        roomId:
          type: string
        status:
          type: string
          enum: [lobby, playing, finished]
        startedAt:
          type: integer
          description: Unix timestamp (ms) when this game instance was initialized
        openingTurnOrder:
          type: ["object", "null"]
          description: First-player selection for this game instance; persists so clients can animate it once
          properties:
            id:
              type: string
            startedAt:
              type: integer
            firstPlayerId:
              type: string
            playerIds:
              type: array
              items:
                type: string
          required:
            - id
            - startedAt
            - firstPlayerId
            - playerIds
        canReplaySameBoard:
          type: boolean
          description: True when the original opening board snapshot is available for same-board rematches.
        currentPlayerIndex:
          type: integer
        roundNumber:
          type: integer
        turnCount:
          type: integer
          description: Monotonically increasing counter incremented each time any player's turn ends
        victoryRequirement:
          type: integer
          description: Eminence required to trigger the final round
        cinematicMode:
          type: string
          enum: [standard, epic]
        affinityWell:
          $ref: "#/components/schemas/AffinityCounts"
        forgeTier1:
          type: array
          items:
            $ref: "#/components/schemas/ArtifactCard"
        forgeTier2:
          type: array
          items:
            $ref: "#/components/schemas/ArtifactCard"
        forgeTier3:
          type: array
          items:
            $ref: "#/components/schemas/ArtifactCard"
        deckCounts:
          type: object
          properties:
            tier1:
              type: integer
            tier2:
              type: integer
            tier3:
              type: integer
          required:
            - tier1
            - tier2
            - tier3
        luminaries:
          type: array
          items:
            $ref: "#/components/schemas/Luminary"
        luminaryAffinities:
          type: array
          description: Active affinity state for each claimed Luminary
          items:
            $ref: "#/components/schemas/LuminaryActiveState"
        players:
          type: array
          items:
            $ref: "#/components/schemas/GamePlayerState"
        winnerId:
          type: ["string", "null"]
        winTriggerLuminaryId:
          type: ["string", "null"]
          description: ID of the Luminary whose summon sealed the win; null if the win was sealed by a card forge
        lastAction:
          type: ["object", "null"]
          additionalProperties: true
        actionLog:
          type: array
          items:
            $ref: "#/components/schemas/ActionLogEntry"
        turnTimerSeconds:
          type: ["integer", "null"]
        turnDeadline:
          type: ["integer", "null"]
          description: Unix timestamp (ms) when the current turn auto-passes; null if no timer
        version:
          type: integer
        pendingSummonEvents:
          type: array
          description: Summon events awaiting client acknowledgement (resolve_summon action)
          items:
            $ref: "#/components/schemas/PendingSummonEvent"
        pendingLuminaryActivationEvents:
          type: array
          description: Activation events queued for the short (~4s) per-effect cinematic overlay
          items:
            $ref: "#/components/schemas/PendingLuminaryActivationEvent"
        pendingTurnTransition:
          type: object
          nullable: true
          description: Durable turn-resolution cursor held until all Luminary presentation events are acknowledged
          properties:
            stage:
              type: string
              enum:
                - after_action
                - after_end_effects
                - after_start_effects
            endingPlayerId:
              type: string
            nextPlayerIndex:
              type: integer
          required:
            - stage
            - endingPlayerId
        devLuminarySequenceActive:
          type: boolean
          description: Development-only lease held while the in-game Luminary Sequence Lab still has staged presentations to resolve
        artifactMarkers:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ArtifactMarker"
          description: Active Artifact markers keyed by cardId (v0.8 — Forgotten/Condemned/Nullified/AvatarSeed)
        forgottenHourCycle:
          type: object
          additionalProperties:
            type: object
            properties:
              lastAppliedTurnCount:
                type: integer
              cooldownOwnerTurnsRemaining:
                type: ["integer", "null"]
            required:
              - lastAppliedTurnCount
              - cooldownOwnerTurnsRemaining
          description: Owner-relative Forgotten Hour timing keyed by source playerId
        avatarSeedDeckSeeds:
          type: array
          items:
            type: string
          description: Card IDs currently in deck with Avatar Seed markers (v0.8)
        avatarSeedOwnerId:
          type: ["string", "null"]
          description: Player ID who owns Avatar Seeds; null if inactive (v0.8)
        firstHungerAvailable:
          type: ["string", "null"]
          description: Player ID if Final Hunger Assimilation is available this turn (v0.8)
        catalystBloomBurnCount:
          type: integer
          description: Burn count accumulator for Catalyst Bloom since owner's last turn (v0.8)
        concordanceMandalaTriggered:
          type: boolean
          description: True once Concordance Mandala Perfect Coherence has fired (v0.8)
        glassOrchardTriggered:
          type: boolean
          description: True once The Glass Orchard Perfect Replication has fired (v0.8)
        burnPile:
          type: array
          items:
            type: string
          description: Ordered list of Burned Artifact IDs awaiting an effect that may return them to their Archives
        burnEvents:
          type: array
          items:
            $ref: "#/components/schemas/BurnEvent"
          description: Ordered list of individual Burn events, including source Luminary and final destination
        coreActionUsed:
          type: boolean
          description: True once the current player has used their core action this turn (Harness, Forge, or reserve); resets only when the staged Luminary resolution pipeline releases the next turn
        pendingLuminaryChoice:
          type: object
          nullable: true
          description: Set when the current player must choose the order to claim multiple simultaneous Luminaries
          properties:
            playerId:
              type: string
            candidates:
              type: array
              items:
                type: string
            createdAt:
              type: integer
          required:
            - playerId
            - candidates
            - createdAt
      required:
        - roomId
        - status
        - startedAt
        - openingTurnOrder
        - canReplaySameBoard
        - currentPlayerIndex
        - roundNumber
        - turnCount
        - victoryRequirement
        - cinematicMode
        - affinityWell
        - forgeTier1
        - forgeTier2
        - forgeTier3
        - deckCounts
        - luminaries
        - luminaryAffinities
        - players
        - winnerId
        - winTriggerLuminaryId
        - lastAction
        - actionLog
        - turnTimerSeconds
        - turnDeadline
        - version
        - pendingSummonEvents
        - pendingLuminaryActivationEvents
        - pendingTurnTransition

    ActionRequest:
      type: object
      properties:
        sessionToken:
          type: string
        type:
          type: string
          enum:
            - harness_three_affinities
            - harness_two_affinities
            - reserve_artifact
            - forge_artifact
            - forge_reserved_artifact
            - pass
            - surrender
            - toggle_luminary_affinity
            - resolve_summon
            - resolve_luminary_activation
            - plan_action
            - execute_plan
            - cancel_plan
            - tutorial_fast_forward
            - set_civ_name
            - choose_luminary_order
            - assimilate
        affinities:
          $ref: "#/components/schemas/AffinityCounts"
        affinity:
          type: string
          enum: [flare, continuum, verdance, abyss, radiance]
          description: Affinity selected for a same-Affinity Harness; legacy Luminary toggle requests are rejected
        cardId:
          type: string
        tier:
          type: integer
        luminaryId:
          type: string
          description: Luminary ID for Luminary-specific action payloads
        eventId:
          type: string
          description: Event ID for resolve_summon action
        returnAffinities:
          type: object
          description: Affinities to return when a Harness or reserve would exceed the 10-Affinity holding limit (sparse map — include only the Affinities being returned; for reserve_artifact use exactly 1 total when the holding limit is reached)
          properties:
            flare:
              type: integer
            continuum:
              type: integer
            verdance:
              type: integer
            abyss:
              type: integer
            radiance:
              type: integer
            singularity:
              type: integer
        plannedActionData:
          type: object
          additionalProperties: true
          description: Nested action payload for plan_action type
        civName:
          type: string
          description: New civilization name for set_civ_name action
        orderedIds:
          type: array
          items:
            type: string
          description: Ordered list of luminaryIds for choose_luminary_order action
      required:
        - sessionToken
        - type
