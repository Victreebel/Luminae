          $ref: "#/components/schemas/AffinityCounts"
        bonuses:
          $ref: "#/components/schemas/AffinityCounts"
        eminence:
          type: integer
        reservedArtifacts:
          type: array
          items:
            $ref: "#/components/schemas/ArtifactCard"
        forgedArtifactIds:
          type: array
          items:
            type: string
        civilization:
          $ref: "#/components/schemas/CivilizationPublicState"
          description: Public Civilization history and operational state; omitted only for legacy responses
        pendingArtifactRepairIds:
          type: array
          items:
            type: string
          description: Damaged Artifact implementations queued for free repair at the end of this player's turn
        blueprintPrivateStates:
          type: array
          description: Owner-only assembly and secret device state; omitted from opponent projections
          items:
            $ref: "#/components/schemas/BlueprintPrivateState"
        blueprintPresentationVariants:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/BlueprintPresentationVariant"
          description: Owner-only presentation snapshot before manifestation
        manifestedBlueprintDevices:
          type: array
          description: Public devices revealed after manifestation
          items:
            $ref: "#/components/schemas/ManifestedDevicePublicState"
        assimilatedArtifactIds:
          type: array
          items:
            type: string
          description: Historical IDs consumed by Final Hunger; no longer operational and do not count for Blueprint recipes, forged-card effects, or victory tie-breaks
        discountedForgeIds:
          type: array
          items:
            type: string
          description: Artifact IDs forged with zero Affinities spent (fully covered by bonuses at forge time)
        forgedArtifacts:
          type: array
          items:
            $ref: "#/components/schemas/ArtifactCard"
        isConnected:
          type: boolean
        claimedLuminaryIds:
          type: array
          items:
            type: string
          description: IDs of luminaries this player has claimed
        tideArchiveTopCards:
          type: object
          description: Owner-only top Artifact of each Archive, revealed by Tide Architect
          properties:
            tier1:
              anyOf:
                - $ref: "#/components/schemas/ArtifactCard"
                - type: "null"
            tier2:
              anyOf:
                - $ref: "#/components/schemas/ArtifactCard"
                - type: "null"
            tier3:
              anyOf:
                - $ref: "#/components/schemas/ArtifactCard"
                - type: "null"
          required:
            - tier1
            - tier2
            - tier3
        tideArchiveForgeAvailable:
          type: boolean
          description: Whether this player retains Tide Architect's one-use Archive-top Forge
        plannedAction:
          type: ["object", "null"]
          additionalProperties: true
          description: Pre-committed action to auto-execute when this player's turn arrives
        plannedActionCancelReason:
          type: ["string", "null"]
          description: Reason the last planned action was auto-cancelled, if applicable
        civName:
          type: ["string", "null"]
