        - playerName
        - avatarId
        - isAi
        - aiDifficulty
        - affinities
        - bonuses
        - eminence
        - reservedArtifacts
        - forgedArtifactIds
        - discountedForgeIds
        - forgedArtifacts
        - isConnected
        - claimedLuminaryIds
        - plannedAction
        - plannedActionCancelReason
        - civName

    LuminaryActiveState:
      type: object
      properties:
        luminaryId:
          type: string
        ownerId:
          type: string
        activeAffinity:
          type: string
          enum: [flare, continuum, verdance, abyss, radiance]
        eligibleAffinities:
          type: array
          items:
            type: string
            enum: [flare, continuum, verdance, abyss, radiance]
        summonedAtTurnCount:
          type: integer
      required:
        - luminaryId
        - ownerId
        - activeAffinity
        - eligibleAffinities
        - summonedAtTurnCount

    PendingSummonEvent:
      type: object
      properties:
        eventId:
          type: string
        luminaryId:
          type: string
        claimedByPlayerId:
          type: string
        arrivalSound:
          type: string
          enum: [standard, first_resonance]
          description: Public arrival cue snapshotted from the claiming player's equipped cosmetic
        createdAt:
          type: integer
          description: Unix ms timestamp when this event was created; optional for backward compat
      required:
        - eventId
        - luminaryId
        - claimedByPlayerId

    LuminaryAffinityReturn:
      type: object
      description: One authoritative player/Affinity token return caused by a Luminary activation
      properties:
        playerId:
          type: string
        affinityType:
          type: string
          enum: [flare, continuum, verdance, abyss, radiance, singularity]
        affinityAmount:
          type: integer
          minimum: 0
      required:
        - playerId
        - affinityType
        - affinityAmount

    PendingLuminaryActivationEvent:
      type: object
      description: An activation event queued for the short (~4s) per-effect cinematic overlay
      properties:
        eventId:
          type: string
        luminaryId:
          type: string
        effectType:
          type: string
          enum: [summon, action, end_of_turn, start_of_turn]
          description: Which hook fired this event
        triggeringPlayerId:
          type: string
          description: Player ID who owns the Luminary
        createdAt:
          type: integer
          description: Unix ms timestamp when this event was created; optional for backward compat
        targetCardIds:
          type: array
          items:
            type: string
          description: Artifact IDs targeted by this activation (e.g. condemned Artifacts for start_of_turn burn). Captured server-side before state mutations clear artifactMarkers.
        targetSlotIds:
          type: array
          items:
            type: string
          description: Forge mold coordinates targeted by this activation, encoded as tier-slotIndex
        affinityType:
          type: string
          enum: [flare, continuum, verdance, abyss, radiance]
          description: Legacy single-return Affinity retained for queued games created before Balance Due became global
        affinityAmount:
          type: integer
          minimum: 0
          description: Legacy single-return amount retained for queued games created before Balance Due became global
        affinityReturns:
          type: array
          description: Authoritative player/Affinity pairs returned by a global activation such as Balance Due
          items:
            $ref: "#/components/schemas/LuminaryAffinityReturn"
        victoryRequirementBefore:
          type: integer
          description: Victory threshold immediately before this activation changed it
        victoryRequirementAfter:
          type: integer
          description: Victory threshold immediately after this activation changed it
        victoryRequirementChange:
          type: integer
          description: Signed victory-threshold delta presented by this activation
      required:
        - eventId
        - luminaryId
        - effectType
        - triggeringPlayerId

    ArtifactMarkerType:
      type: string
      enum: [forgotten, condemned, nullified, avatar_seed]

    ArtifactBrand:
      type: object
      description: One persistent Luminary brand carried by an Artifact
      properties:
        type:
          $ref: "#/components/schemas/ArtifactMarkerType"
        ownerId:
          type: string
        summonedAtTurnCount:
          type: integer
      required:
        - type
        - ownerId
        - summonedAtTurnCount

    ArtifactMarker:
      allOf:
        - $ref: "#/components/schemas/ArtifactBrand"
        - type: object
          description: Persistent brands carried by an Artifact. Top-level fields mirror the newest brand for backward compatibility.
          properties:
            brands:
              type: array
              items:
                $ref: "#/components/schemas/ArtifactBrand"

    GameState:
      type: object
      properties:
        eventDelivery:
          $ref: "#/components/schemas/EventDelivery"
        eventForecast:
          $ref: "#/components/schemas/EventForecast"
        eventFrequency:
          $ref: "#/components/schemas/EventFrequency"
        roomId:
          type: string
        status:
          type: string
          enum: [lobby, playing, finished]
        eventContentProfile:
          type: string
          enum: [general_v1, general_v2, lore_pilot_v1]
          description: Fixed match content profile; never depends on individual account progress.
        eventRulesVersion: { type: string }
        eventCardPool:
          type: array
          description: Eligible Event catalog for scheduled delivery, or the historical exact selection for Archive delivery. Scheduled selections and order remain private.
          items:
            type: string
            enum: [event_planetary_affinity_bloom, event_planetary_forge_drift, event_stellar_containment_cascade, event_stellar_affinity_inversion, event_stellar_system_shock, event_galactic_entropy_storm, event_galactic_terminus_tide, event_galactic_fracture_wave, event_planetary_signal_clarity, event_stellar_synchronization_shear]
        scenarioId:
          type: ["string", "null"]
          description: Server-authored campaign scenario identifier
        finishReason:
          type: ["string", "null"]
          enum: [win, surrender, withdrawal, null]
          description: Normalized reason a finished game ended
        lumiiThresholdApproach:
          anyOf:
            - $ref: "#/components/schemas/LumiiThresholdApproach"
            - type: "null"
          description: Immutable approach chosen for the Lumii Vault encounter
        traceScenario:
          anyOf:
            - $ref: "#/components/schemas/TraceScenarioState"
            - type: "null"
          description: Public, reconnect-safe state for The Trace Chronicle
        recurrenceScenario:
          anyOf:
            - $ref: "#/components/schemas/RecurrenceScenarioState"
            - type: "null"
          description: Public, reconnect-safe state for The Recurrence Chronicle
        triangulationScenario:
          anyOf:
            - $ref: "#/components/schemas/TriangulationScenarioState"
            - type: "null"
          description: Public, reconnect-safe state for The Triangulation Chronicle
        startedAt:
          type: integer
          description: Unix timestamp (ms) when this game instance was initialized
        openingTurnOrder:
          type: ["object", "null"]
          description: First-player selection for this game instance; persists so clients can animate it once
          properties:
            id:
              type: string
            startedAt:
              type: integer
            firstPlayerId:
              type: string
            playerIds:
              type: array
              items:
                type: string
          required:
            - id
            - startedAt
            - firstPlayerId
            - playerIds
        canReplaySameBoard:
          type: boolean
          description: True when the original opening board snapshot is available for same-board rematches.
        currentPlayerIndex:
          type: integer
        roundNumber:
          type: integer
        turnCount:
          type: integer
          description: Monotonically increasing counter incremented each time any player's turn ends
        victoryRequirement:
          type: integer
          description: Eminence required to trigger the final round
        legacyVictoryRequirement:
          type: integer
          description: Distinct manifested Blueprint projects required to trigger the final round through the Legacy Path
        voidSealOwnerId:
          type: ["string", "null"]
          description: Deprecated compatibility field; Void Seal was removed and this is always null
        cinematicMode:
          type: string
          enum: [standard, epic]
        affinityWell:
          $ref: "#/components/schemas/AffinityCounts"
        forgeTier1:
          type: array
          description: Public Artifact molds; an activating Event occupies a null mold until its presentation resolves.
          items:
            anyOf:
              - $ref: "#/components/schemas/ArtifactCard"
              - type: "null"
        forgeTier2:
          type: array
          description: Public Artifact molds; an activating Event occupies a null mold until its presentation resolves.
          items:
            anyOf:
              - $ref: "#/components/schemas/ArtifactCard"
              - type: "null"
        forgeTier3:
          type: array
          description: Public Artifact molds; an activating Event occupies a null mold until its presentation resolves.
          items:
            anyOf:
              - $ref: "#/components/schemas/ArtifactCard"
              - type: "null"
        deckCounts:
          type: object
          properties:
            tier1:
              type: integer
            tier2:
              type: integer
            tier3:
              type: integer
          required:
            - tier1
            - tier2
            - tier3
        luminaries:
          type: array
          items:
            $ref: "#/components/schemas/Luminary"
        luminaryAffinities:
          type: array
          description: Active affinity state for each claimed Luminary
          items:
            $ref: "#/components/schemas/LuminaryActiveState"
        players:
          type: array
          items:
            $ref: "#/components/schemas/GamePlayerState"
        winnerId:
          type: ["string", "null"]
        legacyWinnerId:
          type: ["string", "null"]
          description: First player to complete the Legacy Path; null when no civilization completed it
        winTriggerLuminaryId:
          type: ["string", "null"]
          description: ID of the Luminary whose summon sealed the win; null if the win was sealed by a card forge
        lastAction:
          type: ["object", "null"]
          additionalProperties: true
        actionLog:
          type: array
          items:
            $ref: "#/components/schemas/ActionLogEntry"
        turnTimerSeconds:
          type: ["integer", "null"]
        turnDeadline:
          type: ["integer", "null"]
          description: Unix timestamp (ms) when the current turn auto-passes; null if no timer
        version:
          type: integer
        pendingSummonEvents:
          type: array
          description: Summon events awaiting client acknowledgement (resolve_summon action)
          items:
            $ref: "#/components/schemas/PendingSummonEvent"
        pendingLuminaryActivationEvents:
          type: array
          description: Activation events queued for the short (~4s) per-effect cinematic overlay
          items:
            $ref: "#/components/schemas/PendingLuminaryActivationEvent"
        pendingBlueprintManifestationEvents:
          type: array
          description: Blueprint manifestation events awaiting synchronized presentation acknowledgement
          items:
            $ref: "#/components/schemas/BlueprintManifestationEvent"
        pendingBlueprintDetonationEvents:
          type: array
          description: Blueprint detonation events awaiting synchronized presentation acknowledgement
          items:
            $ref: "#/components/schemas/BlueprintDetonationEvent"
        pendingCivilizationEventCards:
          type: array
          description: Authoritatively resolved Civilization Events awaiting synchronized presentation acknowledgement
          items:
            $ref: "#/components/schemas/CivilizationEventInstance"
        civilizationEventDeck:
          $ref: "#/components/schemas/CivilizationEventDeckState"
        scenarioProtocols:
          type: array
          description: Anonymous public protocol devices used by identity-redacted scenarios
          items:
            $ref: "#/components/schemas/ScenarioProtocolPublicState"
        pendingScenarioProtocolEvents:
          type: array
          description: Anonymous scenario protocol events awaiting normal Blueprint acknowledgement
          items:
            $ref: "#/components/schemas/ScenarioProtocolEvent"
