        - stage
        - function

    BlueprintDefinition:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/BlueprintId"
        name:
          type: string
        family:
          type: string
          enum: [catastrophe_engine, industrial_chain, institution, covenant]
        components:
          type: array
          items:
            $ref: "#/components/schemas/BlueprintComponentDefinition"
        publicEffect:
          type: string
        initialDeviceState:
          $ref: "#/components/schemas/BlueprintDeviceState"
        competitiveApproved:
          type: boolean
        presentation:
          type: object
          properties:
            serialCode:
              type: string
            scaleLabel:
              type: string
              enum: [Planetary, Stellar]
            canonicalVariant:
              $ref: "#/components/schemas/BlueprintPresentationVariant"
            manifestationTreatment:
              type: string
              enum: [dedicated, shared]
            detonationTreatment:
              type: string
              enum: [dedicated, none]
          required:
            - serialCode
            - scaleLabel
            - canonicalVariant
            - manifestationTreatment
            - detonationTreatment
        civilization:
          type: object
          properties:
            projectForm:
              type: string
            scaleBand:
              type: string
              enum: [planetary, stellar, galactic]
            manifestationScale:
              type: string
              enum: [installation, satellite, planetary, stellar, distributed]
            manifestationMotion:
              type: string
              enum: [gimbaled_orbit, industrial_transit, signal_constellation, shield_breath]
            affinity:
              type: string
              enum: [flare, continuum, verdance, abyss, radiance]
            siteTitle:
              type: string
            visibleAs:
              type: string
            siteSummary:
              type: string
            laneLabel:
              type: string
            manifestation:
              type: string
              const: automatic
            triggerWindows:
              type: array
              items: { type: string }
            resolutionForm:
              type: string
            pressureTags:
              type: array
              items: { type: string }
            providedCapabilityIds:
              type: array
              items: { type: string }
            interactingCapabilityIds:
              type: array
              items: { type: string }
            consequencePolicyStatus:
              type: string
          required:
            - projectForm
            - scaleBand
            - manifestationScale
            - manifestationMotion
            - affinity
            - siteTitle
            - visibleAs
            - siteSummary
            - laneLabel
            - manifestation
            - triggerWindows
            - resolutionForm
            - pressureTags
            - providedCapabilityIds
            - interactingCapabilityIds
            - consequencePolicyStatus
