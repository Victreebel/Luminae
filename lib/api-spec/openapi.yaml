            - set_civ_name
            - repair_artifacts
            - choose_luminary_order
            - resolve_chronicle_choice
            - assimilate
        affinities:
          $ref: "#/components/schemas/AffinityCounts"
        affinity:
          type: string
          enum: [flare, continuum, verdance, abyss, radiance]
          description: Affinity selected for a same-Affinity Harness; legacy Luminary toggle requests are rejected
        voidSealAffinity:
          type: string
          enum: [flare, continuum, verdance, abyss, radiance]
          description: Deprecated compatibility field; ignored by the game engine
        cardId:
          type: string
        artifactIds:
          type: array
          items:
            type: string
          maxItems: 64
          description: Damaged Artifact implementation IDs to queue for end-of-turn repair
        tier:
          type: integer
        blueprintAction:
          type: string
          enum: [foundry_sustainable, foundry_overdrive, foundry_recovery]
          description: Explicit Project claim path; absent means an ordinary Forge
        luminaryId:
          type: string
          description: Luminary ID for Luminary-specific action payloads
        eventId:
          type: string
          description: Event ID for resolve_summon action
        returnAffinities:
          type: object
          description: Affinities to return when a Harness or reserve would exceed the 10-Affinity holding limit (sparse map — include only the Affinities being returned; for reserve_artifact use exactly 1 total when the holding limit is reached)
          properties:
            flare:
              type: integer
            continuum:
              type: integer
            verdance:
              type: integer
            abyss:
              type: integer
            radiance:
              type: integer
            singularity:
              type: integer
        plannedActionData:
          type: object
          additionalProperties: true
          description: Nested action payload for plan_action type
        civName:
          type: string
          description: New civilization name for set_civ_name action
        orderedIds:
          type: array
          items:
            type: string
          description: Ordered list of luminaryIds for choose_luminary_order action
        traceGuidanceMethod:
          $ref: "#/components/schemas/TraceGuidanceMethod"
        recurrenceCustodyMethod:
          $ref: "#/components/schemas/RecurrenceCustodyMethod"
          description: Architect custody selected during The Recurrence decision window
        triangulationCoordinationArchitecture:
          $ref: "#/components/schemas/TriangulationCoordinationArchitecture"
          description: Architect coordination architecture selected during The Triangulation Alignment
      required:
        - sessionToken
        - type
