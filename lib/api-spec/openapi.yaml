openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Luminae multiplayer tabletop game API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: rooms
    description: Room management
  - name: game
    description: Game state and actions
  - name: auth
    description: Account authentication
  - name: friends
    description: Friends list and requests
  - name: challenges
    description: Player challenges

paths:
  /cards/lore:
    get:
      operationId: getCardLoreCatalog
      tags: [game]
      summary: Return name and flavour text for every card
      responses:
        "200":
          description: Card lore map keyed by card ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardLoreCatalog"

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /rooms:
    post:
      operationId: createRoom
      tags: [rooms]
      summary: Create a new game room
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoomBody"
      responses:
        "201":
          description: Room created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomWithPlayer"

  /rooms/{inviteCode}:
    get:
      operationId: getRoomByInviteCode
      tags: [rooms]
      summary: Get room info by invite code
      parameters:
        - name: inviteCode
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Room info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomInfo"
        "404":
          description: Room not found

  /rooms/{roomId}/join:
    post:
      operationId: joinRoom
      tags: [rooms]
      summary: Join a room
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinRoomBody"
      responses:
        "200":
          description: Joined room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomWithPlayer"
        "400":
          description: Cannot join room
        "404":
          description: Room not found

  /rooms/{roomId}/rejoin:
    post:
      operationId: rejoinRoom
      tags: [rooms]
      summary: Reclaim an existing player slot in a room (works in any status)
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejoinRoomBody"
      responses:
        "200":
          description: Rejoined room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomWithPlayer"
        "404":
          description: No matching player

  /rooms/{roomId}/ai-players:
    post:
      operationId: addAiPlayer
      tags: [rooms]
      summary: Add an AI player to the room (host only)
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddAiPlayerBody"
      responses:
        "200":
          description: AI player added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomPlayer"
        "400":
          description: Cannot add AI player
        "403":
          description: Not the host

  /rooms/{roomId}/start:
    post:
      operationId: startGame
      tags: [rooms]
      summary: Start the game (host only)
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HostActionBody"
      responses:
        "200":
          description: Game started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameState"
        "400":
          description: Cannot start game
        "403":
          description: Not the host

  /rooms/{roomId}/rematch:
    post:
      operationId: rematch
      tags: [rooms]
      summary: Restart the game with the same players (host only)
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HostActionBody"
      responses:
        "200":
          description: Game restarted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameState"
        "400":
          description: Game is not finished
        "403":
          description: Not the host

  /rooms/{roomId}/state:
    get:
      operationId: getGameState
      tags: [game]
      summary: Get current game state
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
        - name: sessionToken
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Game state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameState"
        "403":
          description: Not a member of this room
        "404":
          description: Room not found

  /rooms/{roomId}/actions:
    post:
      operationId: submitAction
      tags: [game]
      summary: Submit a turn action
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActionRequest"
      responses:
        "200":
          description: Action applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameState"
        "400":
          description: Invalid action
        "403":
          description: Not your turn

  /rooms/{roomId}/players/{playerId}:
    delete:
      operationId: kickPlayer
      tags: [rooms]
      summary: Kick a player (host only)
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
        - name: playerId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HostActionBody"
      responses:
        "200":
          description: Player kicked
        "403":
          description: Not the host
        "404":
          description: Player not found

  /rooms/{roomId}/quit:
    post:
      operationId: quitRoom
      tags: [rooms]
      summary: Quit / forfeit a game
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuitRoomBody"
      responses:
        "200":
          description: Quit successfully
        "403":
          description: Not a member
        "404":
          description: Room not found

  /auth/register:
    post:
      operationId: registerAccount
      tags: [auth]
      summary: Create a new account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterBody"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountWithToken"
        "400":
          description: Validation error
        "409":
          description: Username or email already taken

  /auth/login:
    post:
      operationId: loginAccount
      tags: [auth]
      summary: Sign in to an existing account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountWithToken"
        "401":
          description: Invalid credentials

  /auth/logout:
    post:
      operationId: logoutAccount
      tags: [auth]
      summary: Invalidate the current account session
      security:
        - accountToken: []
      responses:
        "200":
          description: Logged out

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get the current account with active rooms
      security:
        - accountToken: []
      responses:
        "200":
          description: Current account with active rooms
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetMeResponse"
        "401":
          description: Unauthorized

  /auth/me/games:
    get:
      operationId: getMyGames
      tags: [auth]
      summary: List active (non-finished) games for the current account
      security:
        - accountToken: []
      responses:
        "200":
          description: List of active games
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveGamesResponse"
        "401":
          description: Unauthorized

  /auth/me/stats:
    get:
      operationId: getMyStats
      tags: [auth]
      summary: Get lifetime stats and game history for the current account
      security:
        - accountToken: []
      responses:
        "200":
          description: Lifetime stats and recent game history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerStatsResponse"
        "401":
          description: Unauthorized

  /friends:
    get:
      operationId: listFriends
      tags: [friends]
      summary: List accepted friends with online status
      security:
        - accountToken: []
      responses:
        "200":
          description: Friends list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendsListResponse"

  /friends/requests:
    get:
      operationId: listFriendRequests
      tags: [friends]
      summary: List incoming pending friend requests
      security:
        - accountToken: []
      responses:
        "200":
          description: Incoming requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendRequestsResponse"
    post:
      operationId: sendFriendRequest
      tags: [friends]
      summary: Send a friend request by username
      security:
        - accountToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendFriendRequestBody"
      responses:
        "201":
          description: Request sent
        "404":
          description: User not found
        "409":
          description: Already friends or request pending

  /friends/requests/{id}:
    patch:
      operationId: respondToFriendRequest
      tags: [friends]
      summary: Accept or decline a friend request
      security:
        - accountToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FriendRequestActionBody"
      responses:
        "200":
          description: Request updated
        "404":
          description: Request not found

  /friends/{id}:
    delete:
      operationId: removeFriend
      tags: [friends]
      summary: Remove a friend
      security:
        - accountToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Unfriended
        "404":
          description: Friendship not found

  /challenges:
    get:
      operationId: listChallenges
      tags: [challenges]
      summary: List incoming pending challenges
      security:
        - accountToken: []
      responses:
        "200":
          description: Pending challenges
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengesResponse"
    post:
      operationId: createChallenge
      tags: [challenges]
      summary: Challenge a friend to a game
      security:
        - accountToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChallengeBody"
      responses:
        "201":
          description: Challenge created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeCreatedResponse"
        "403":
          description: Not friends
        "404":
          description: User not found
        "409":
          description: Challenge already pending

  /challenges/{id}:
    patch:
      operationId: respondToChallenge
      tags: [challenges]
      summary: Accept or decline a challenge
      security:
        - accountToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChallengeActionBody"
      responses:
        "200":
          description: Challenge resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeAcceptedResponse"
        "404":
          description: Challenge not found
        "410":
          description: Challenge expired

components:
  securitySchemes:
    accountToken:
      type: http
      scheme: bearer
  schemas:
    CardLoreEntry:
      type: object
      properties:
        name:
          type: string
        flavor:
          type: string
        artifactForm:
          type: string
        blueprintRole:
          type: string
        blueprintFamilies:
          type: string
        civLane:
          type: string
        engineeringScale:
          type: string
          enum:
            - Planetary
            - Star-system
            - Galactic
        artPrompt:
          type: string
      required:
        - name
        - flavor

    CardLoreCatalog:
      type: object
      additionalProperties:
        $ref: "#/components/schemas/CardLoreEntry"

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    QuitRoomBody:
      type: object
      properties:
        sessionToken:
          type: string
      required:
        - sessionToken

    RegisterBody:
      type: object
      properties:
        username:
          type: string
          minLength: 2
          maxLength: 32
        password:
          type: string
          minLength: 6
        email:
          type: string
      required:
        - username
        - password

    LoginBody:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
        - username
        - password

    ActiveRoomEntry:
      type: object
      properties:
        roomId:
          type: string
        inviteCode:
          type: string
        status:
          type: string
          enum: [lobby, playing]
        sessionToken:
          type: string
        playerId:
          type: string
        isHost:
          type: boolean
      required:
        - roomId
        - inviteCode
        - status
        - sessionToken
        - playerId
        - isHost

    AccountInfo:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        email:
          type: ["string", "null"]
        createdAt:
          type: string
      required:
        - id
        - username

    GetMeResponse:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        email:
          type: ["string", "null"]
        createdAt:
          type: string
        activeRooms:
          type: array
          items:
            $ref: "#/components/schemas/ActiveRoomEntry"
      required:
        - id
        - username
        - activeRooms

    AccountWithToken:
      type: object
      properties:
        account:
          $ref: "#/components/schemas/AccountInfo"
        token:
          type: string
        expiresAt:
          type: string
      required:
        - account
        - token
        - expiresAt

    ActiveGame:
      type: object
      properties:
        roomId:
          type: string
        inviteCode:
          type: string
        status:
          type: string
          enum: [lobby, playing]
        maxPlayers:
          type: integer
        currentPlayers:
          type: integer
        updatedAt:
          type: string
        sessionToken:
          type: string
        playerId:
          type: string
        isHost:
          type: boolean
        playerName:
          type: string
        avatarId:
          type: ["string", "null"]
      required:
        - roomId
        - inviteCode
        - status
        - maxPlayers
        - currentPlayers
        - updatedAt
        - sessionToken
        - playerId
        - isHost
        - playerName

    ActiveGamesResponse:
      type: object
      properties:
        games:
          type: array
          items:
            $ref: "#/components/schemas/ActiveGame"
      required:
        - games

    GameHistoryEntry:
      type: object
      properties:
        roomId:
          type: string
        inviteCode:
          type: string
        finishedAt:
          type: string
          description: ISO timestamp when the game finished (room updatedAt)
        result:
          type: string
          enum: [win, loss, tie]
        eminenceEarned:
          type: integer
          description: Eminence (lumens) earned by the player in this game
        totalPlayers:
          type: integer
          description: Number of human players in the game
      required:
        - roomId
        - inviteCode
        - finishedAt
        - result
        - eminenceEarned
        - totalPlayers

    PlayerStatsResponse:
      type: object
      properties:
        gamesPlayed:
          type: integer
        wins:
          type: integer
        losses:
          type: integer
        ties:
          type: integer
        avgEminence:
          type: number
          format: float
          description: Average Eminence earned across all finished games
        recentGames:
          type: array
          items:
            $ref: "#/components/schemas/GameHistoryEntry"
          description: Most recent finished games, newest first (up to 20)
      required:
        - gamesPlayed
        - wins
        - losses
        - ties
        - avgEminence
        - recentGames

    FriendEntry:
      type: object
      properties:
        friendshipId:
          type: string
        accountId:
          type: string
        username:
          type: string
        isOnline:
          type: boolean
      required:
        - friendshipId
        - accountId
        - username
        - isOnline

    FriendsListResponse:
      type: object
      properties:
        friends:
          type: array
          items:
            $ref: "#/components/schemas/FriendEntry"
      required:
        - friends

    FriendRequestEntry:
      type: object
      properties:
        id:
          type: string
        from:
          type: object
          properties:
            accountId:
              type: string
            username:
              type: string
          required:
            - accountId
            - username
        createdAt:
          type: string
      required:
        - id
        - from
        - createdAt

    FriendRequestsResponse:
      type: object
      properties:
        requests:
          type: array
          items:
            $ref: "#/components/schemas/FriendRequestEntry"
      required:
        - requests

    SendFriendRequestBody:
      type: object
      properties:
        username:
          type: string
      required:
        - username

    FriendRequestActionBody:
      type: object
      properties:
        action:
          type: string
          enum: [accept, decline]
      required:
        - action

    ChallengeEntry:
      type: object
      properties:
        id:
          type: string
        challengerUsername:
          type: string
        challengerAccountId:
          type: string
        roomId:
          type: string
        inviteCode:
          type: string
        expiresAt:
          type: string
      required:
        - id
        - challengerUsername
        - challengerAccountId
        - roomId
        - inviteCode
        - expiresAt

    ChallengesResponse:
      type: object
      properties:
        challenges:
          type: array
          items:
            $ref: "#/components/schemas/ChallengeEntry"
      required:
        - challenges

    CreateChallengeBody:
      type: object
      properties:
        challengedUsername:
          type: string
        maxPlayers:
          type: integer
          minimum: 2
          maximum: 4
        turnTimerSeconds:
          type: ["integer", "null"]
      required:
        - challengedUsername

    ChallengeCreatedResponse:
      type: object
      properties:
        id:
          type: string
        roomId:
          type: string
        inviteCode:
          type: string
        challengedUsername:
          type: string
        expiresAt:
          type: string
        sessionToken:
          type: string
        playerId:
          type: string
      required:
        - id
        - roomId
        - inviteCode
        - challengedUsername
        - expiresAt
        - sessionToken
        - playerId

    ChallengeActionBody:
      type: object
      properties:
        action:
          type: string
          enum: [accept, decline]
      required:
        - action

    ChallengeAcceptedResponse:
      type: object
      properties:
        ok:
          type: boolean
        resolution:
          type: string
        sessionToken:
          type: string
        room:
          type: object
          properties:
            id:
              type: string
            inviteCode:
              type: string
            status:
              type: string
            maxPlayers:
              type: integer
            turnTimerSeconds:
              type: ["integer", "null"]
          required:
            - id
            - inviteCode
            - status
            - maxPlayers
        player:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            isHost:
              type: boolean
          required:
            - id
            - name
            - isHost
      required:
        - ok
        - resolution

    CreateRoomBody:
      type: object
      properties:
        hostName:
          type: string
        maxPlayers:
          type: integer
          minimum: 2
          maximum: 4
        turnTimerSeconds:
          type: ["integer", "null"]
          description: Optional per-turn time limit in seconds (null = no timer)
        avatarId:
          type: ["string", "null"]
          description: Avatar identifier chosen by the host
      required:
        - hostName
        - maxPlayers

    JoinRoomBody:
      type: object
      properties:
        playerName:
          type: string
        avatarId:
          type: ["string", "null"]
          description: Avatar identifier chosen by the joining player
      required:
        - playerName

    RejoinRoomBody:
      type: object
      properties:
        playerName:
          type: string
      required:
        - playerName

    HostActionBody:
      type: object
      properties:
        sessionToken:
          type: string
      required:
        - sessionToken

    AddAiPlayerBody:
      type: object
      properties:
        sessionToken:
          type: string
        difficulty:
          type: string
          enum: [easy, medium, hard, passive]
      required:
        - sessionToken
        - difficulty

    RoomPlayer:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        isHost:
          type: boolean
        isConnected:
          type: boolean
        orderIndex:
          type: integer
        isAi:
          type: boolean
        aiDifficulty:
          type: ["string", "null"]
          enum: [easy, medium, hard, null]
        avatarId:
          type: ["string", "null"]
      required:
        - id
        - name
        - isHost
        - isConnected
        - orderIndex
        - isAi

    RoomInfo:
      type: object
      properties:
        id:
          type: string
        inviteCode:
          type: string
        status:
          type: string
          enum: [lobby, playing, finished]
        maxPlayers:
          type: integer
        turnTimerSeconds:
          type: ["integer", "null"]
        players:
          type: array
          items:
            $ref: "#/components/schemas/RoomPlayer"
      required:
        - id
        - inviteCode
        - status
        - maxPlayers
        - players

    RoomWithPlayer:
      type: object
      properties:
        room:
          $ref: "#/components/schemas/RoomInfo"
        player:
          $ref: "#/components/schemas/RoomPlayer"
        sessionToken:
          type: string
      required:
        - room
        - player
        - sessionToken

    CrystalCounts:
      type: object
      properties:
        ruby:
          type: integer
        sapphire:
          type: integer
        emerald:
          type: integer
        onyx:
          type: integer
        pearl:
          type: integer
        flux:
          type: integer
      required:
        - ruby
        - sapphire
        - emerald
        - onyx
        - pearl
        - flux

    ArtifactCard:
      type: object
      properties:
        id:
          type: string
        tier:
          type: integer
        bonusColor:
          type: string
          enum: [ruby, sapphire, emerald, onyx, pearl]
        lumens:
          type: integer
        cost:
          $ref: "#/components/schemas/CrystalCounts"
        name:
          type: string
        flavor:
          type: string
        bonusesAtForge:
          $ref: "#/components/schemas/CrystalCounts"
          description: "Snapshot of the player's effective bonuses at the moment this card was forged. Present only on purchased cards; absent on market/reserved cards and on cards forged before this feature was added."
      required:
        - id
        - tier
        - bonusColor
        - lumens
        - cost
        - name
        - flavor

    ActionLogEntry:
      type: object
      properties:
        playerId:
          type: string
        playerName:
          type: string
        summary:
          type: string
        turn:
          type: integer
      required:
        - playerId
        - playerName
        - summary
        - turn

    Luminary:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        domain:
          type: string
          description: Cosmic domain or element of this Luminary (e.g. Flame, Time, Stars)
        lumens:
          type: integer
        oblivion:
          type: integer
          description: >
            Oblivion penalty — when this Luminary is claimed, ALL players lose this
            many Eminence. Mutually exclusive with a positive lumens award.
            Omitted (or 0) on normal Eminence Luminaries.
        requirements:
          $ref: "#/components/schemas/CrystalCounts"
        flavor:
          type: string
          description: Short lore/flavor text shown on the Luminary card
        summonColor:
          type: string
          description: Primary hex color used for glow and aura effects
        summonSecondaryColor:
          type: string
          description: Secondary hex color used for aura gradient
        auraStyle:
          type: string
          description: Named aura style for the summoning cutscene
      required:
        - id
        - name
        - domain
        - lumens
        - requirements
        - flavor
        - summonColor
        - summonSecondaryColor
        - auraStyle

    GamePlayerState:
      type: object
      properties:
        playerId:
          type: string
        playerName:
          type: string
        avatarId:
          type: ["string", "null"]
        isAi:
          type: boolean
          description: Whether this player is an AI
        aiDifficulty:
          type: ["string", "null"]
          enum: [easy, medium, hard, null]
          description: AI difficulty level, null for human players or easy AI that never toggles
        crystals:
          $ref: "#/components/schemas/CrystalCounts"
        bonuses:
          $ref: "#/components/schemas/CrystalCounts"
        lumens:
          type: integer
        reservedCards:
          type: array
          items:
            $ref: "#/components/schemas/ArtifactCard"
        purchasedCardIds:
          type: array
          items:
            type: string
        discountedForgeIds:
          type: array
          items:
            type: string
          description: Card IDs that were forged with zero crystals spent (fully covered by bonuses at forge time)
        purchasedCards:
          type: array
          items:
            $ref: "#/components/schemas/ArtifactCard"
        isConnected:
          type: boolean
        claimedLuminaryIds:
          type: array
          items:
            type: string
          description: IDs of luminaries this player has claimed
        plannedAction:
          type: ["object", "null"]
          additionalProperties: true
          description: Pre-committed action to auto-execute when this player's turn arrives
        plannedActionCancelReason:
          type: ["string", "null"]
          description: Reason the last planned action was auto-cancelled, if applicable
        civName:
          type: ["string", "null"]
          description: Player-chosen civilization name; null if not set
      required:
        - playerId
        - playerName
        - avatarId
        - isAi
        - aiDifficulty
        - crystals
        - bonuses
        - lumens
        - reservedCards
        - purchasedCardIds
        - discountedForgeIds
        - purchasedCards
        - isConnected
        - claimedLuminaryIds
        - plannedAction
        - plannedActionCancelReason
        - civName

    LuminaryActiveState:
      type: object
      properties:
        luminaryId:
          type: string
        ownerId:
          type: string
        activeAffinity:
          type: string
          enum: [ruby, sapphire, emerald, onyx, pearl]
        eligibleAffinities:
          type: array
          items:
            type: string
            enum: [ruby, sapphire, emerald, onyx, pearl]
        summonedAtTurnCount:
          type: integer
      required:
        - luminaryId
        - ownerId
        - activeAffinity
        - eligibleAffinities
        - summonedAtTurnCount

    PendingSummonEvent:
      type: object
      properties:
        eventId:
          type: string
        luminaryId:
          type: string
        claimedByPlayerId:
          type: string
        createdAt:
          type: integer
          description: Unix ms timestamp when this event was created; optional for backward compat
      required:
        - eventId
        - luminaryId
        - claimedByPlayerId

    GameState:
      type: object
      properties:
        roomId:
          type: string
        status:
          type: string
          enum: [lobby, playing, finished]
        currentPlayerIndex:
          type: integer
        roundNumber:
          type: integer
        turnCount:
          type: integer
          description: Monotonically increasing counter incremented each time any player's turn ends
        crystalBank:
          $ref: "#/components/schemas/CrystalCounts"
        marketTier1:
          type: array
          items:
            $ref: "#/components/schemas/ArtifactCard"
        marketTier2:
          type: array
          items:
            $ref: "#/components/schemas/ArtifactCard"
        marketTier3:
          type: array
          items:
            $ref: "#/components/schemas/ArtifactCard"
        deckCounts:
          type: object
          properties:
            tier1:
              type: integer
            tier2:
              type: integer
            tier3:
              type: integer
          required:
            - tier1
            - tier2
            - tier3
        luminaries:
          type: array
          items:
            $ref: "#/components/schemas/Luminary"
        luminaryAffinities:
          type: array
          description: Active affinity state for each claimed Luminary
          items:
            $ref: "#/components/schemas/LuminaryActiveState"
        players:
          type: array
          items:
            $ref: "#/components/schemas/GamePlayerState"
        winnerId:
          type: ["string", "null"]
        winTriggerLuminaryId:
          type: ["string", "null"]
          description: ID of the Luminary whose summon sealed the win; null if the win was sealed by a card forge
        lastAction:
          type: ["object", "null"]
          additionalProperties: true
        actionLog:
          type: array
          items:
            $ref: "#/components/schemas/ActionLogEntry"
        turnTimerSeconds:
          type: ["integer", "null"]
        turnDeadline:
          type: ["integer", "null"]
          description: Unix timestamp (ms) when the current turn auto-passes; null if no timer
        version:
          type: integer
        pendingSummonEvents:
          type: array
          description: Summon events awaiting client acknowledgement (resolve_summon action)
          items:
            $ref: "#/components/schemas/PendingSummonEvent"
      required:
        - roomId
        - status
        - currentPlayerIndex
        - roundNumber
        - turnCount
        - crystalBank
        - marketTier1
        - marketTier2
        - marketTier3
        - deckCounts
        - luminaries
        - luminaryAffinities
        - players
        - winnerId
        - winTriggerLuminaryId
        - lastAction
        - actionLog
        - turnTimerSeconds
        - turnDeadline
        - version
        - pendingSummonEvents

    ActionRequest:
      type: object
      properties:
        sessionToken:
          type: string
        type:
          type: string
          enum:
            - take_three_crystals
            - take_two_crystals
            - reserve_card
            - purchase_card
            - purchase_reserved
            - pass
            - surrender
            - toggle_luminary_affinity
            - resolve_summon
            - plan_action
            - cancel_plan
            - tutorial_fast_forward
            - set_civ_name
        crystals:
          $ref: "#/components/schemas/CrystalCounts"
        crystal:
          type: string
          enum: [ruby, sapphire, emerald, onyx, pearl]
        cardId:
          type: string
        tier:
          type: integer
        luminaryId:
          type: string
          description: Luminary ID for toggle_luminary_affinity action
        affinity:
          type: string
          enum: [ruby, sapphire, emerald, onyx, pearl]
          description: Target affinity for toggle_luminary_affinity action
        eventId:
          type: string
          description: Event ID for resolve_summon action
        returnCrystals:
          type: object
          description: Crystals to return when a harvest would exceed the 10-crystal hand limit (sparse map — only include colors being returned)
          properties:
            ruby:
              type: integer
            sapphire:
              type: integer
            emerald:
              type: integer
            onyx:
              type: integer
            pearl:
              type: integer
            flux:
              type: integer
        plannedActionData:
          type: object
          additionalProperties: true
          description: Nested action payload for plan_action type
        civName:
          type: string
          description: New civilization name for set_civ_name action
      required:
        - sessionToken
        - type
