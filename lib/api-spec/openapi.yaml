              cooldownOwnerTurnsRemaining:
                type: ["integer", "null"]
            required:
              - lastAppliedTurnCount
              - cooldownOwnerTurnsRemaining
          description: Owner-relative Forgotten Hour timing keyed by source playerId
        avatarSeedMoldSlots:
          type: array
          items:
            type: string
          description: Permanent Forge molds carrying Avatar Seeds, encoded as tier-slotIndex
        avatarSeedOwnerId:
          type: ["string", "null"]
          description: Player ID who owns Avatar Seeds; null if inactive (v0.8)
        firstHungerAvailable:
          type: ["string", "null"]
          description: Player ID holding Final Hunger's one-use Assimilation action until it is consumed
        catalystBloomBurnCount:
          type: integer
          description: Burn count accumulator for Catalyst Bloom since owner's last turn (v0.8)
        concordanceMandalaTriggered:
          type: boolean
          description: True once Concordance Mandala's 8-Radiance Perfect Coherence milestone has fired
        concordanceMandalaFinalTriggered:
          type: boolean
          description: True once Concordance Mandala's 10-Radiance Perfect Coherence milestone has fired
        glassOrchardTriggered:
          type: boolean
          description: True once The Glass Orchard Perfect Replication has fired (v0.8)
        burnPile:
          type: array
          items:
            type: string
          description: Ordered list of Burned Artifact IDs awaiting an effect that may return them to their Archives
        burnEvents:
          type: array
          items:
            $ref: "#/components/schemas/BurnEvent"
