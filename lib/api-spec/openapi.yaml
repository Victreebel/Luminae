          type: object
          nullable: true
          description: Durable turn-resolution cursor held until all Luminary presentation events are acknowledged
          properties:
            stage:
              type: string
              enum:
                - after_action
                - after_repairs
                - after_end_effects
                - after_start_effects
            endingPlayerId:
              type: string
            nextPlayerIndex:
              type: integer
          required:
            - stage
            - endingPlayerId
