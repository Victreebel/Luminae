        catalystBloomBurnCount:
          type: integer
          description: Burn count accumulator for Catalyst Bloom since owner's last turn (v0.8)
        concordanceMandalaTriggered:
          type: boolean
          description: True once Concordance Mandala's 8-Radiance Perfect Coherence milestone has fired
        concordanceMandalaFinalTriggered:
          type: boolean
          description: True once Concordance Mandala's 10-Radiance Perfect Coherence milestone has fired
        glassOrchardTriggered:
          type: boolean
          description: True once The Glass Orchard Perfect Replication has fired (v0.8)
        burnPile:
          type: array
          items:
            type: string
          description: Ordered list of Burned Artifact IDs awaiting an effect that may return them to their Archives
        burnEvents:
          type: array
          items:
            $ref: "#/components/schemas/BurnEvent"
          description: Ordered list of individual Burn events, including source Luminary and final destination
        annihilatedArtifactIds:
          type: array
          items:
            type: string
          description: Artifacts permanently removed from this game by Annihilation
        brokenCovenantDeclared:
          type: boolean
          description: Campaign-only state that reveals Antimatter's Broken Covenant rider
        coreActionUsed:
          type: boolean
          description: True once the current player has used their core action this turn (Harness, Forge, or reserve); resets only when the staged Luminary resolution pipeline releases the next turn
        pendingLuminaryChoice:
          type: object
          nullable: true
          description: Set when the current player must choose the order to claim multiple simultaneous Luminaries
          properties:
            playerId:
              type: string
            candidates:
              type: array
              items:
                type: string
            createdAt:
              type: integer
          required:
            - playerId
            - candidates
            - createdAt
      required:
        - roomId
        - status
        - scenarioId
        - finishReason
        - lumiiThresholdApproach
        - startedAt
        - openingTurnOrder
        - canReplaySameBoard
        - currentPlayerIndex
        - roundNumber
        - turnCount
        - victoryRequirement
        - cinematicMode
        - affinityWell
        - forgeTier1
        - forgeTier2
        - forgeTier3
        - deckCounts
        - luminaries
        - luminaryAffinities
        - players
        - winnerId
        - winTriggerLuminaryId
        - lastAction
        - actionLog
        - turnTimerSeconds
        - turnDeadline
        - version
        - pendingSummonEvents
        - pendingLuminaryActivationEvents
        - pendingBlueprintManifestationEvents
        - pendingBlueprintDetonationEvents
        - scenarioProtocols
        - pendingScenarioProtocolEvents
        - pendingTurnTransition

    ActionRequest:
      type: object
      properties:
        sessionToken:
          type: string
        type:
          type: string
          enum:
            - harness_three_affinities
            - harness_two_affinities
            - reserve_artifact
            - forge_artifact
            - foundry_forge_artifact
            - recover_foundry_component
            - forge_reserved_artifact
            - pass
            - surrender
            - toggle_luminary_affinity
            - resolve_summon
            - resolve_luminary_activation
            - resolve_blueprint_manifestation
            - resolve_blueprint_detonation
            - plan_action
            - execute_plan
            - cancel_plan
            - set_civ_name
            - choose_luminary_order
            - assimilate
        affinities:
          $ref: "#/components/schemas/AffinityCounts"
        affinity:
          type: string
          enum: [flare, continuum, verdance, abyss, radiance]
          description: Affinity selected for a same-Affinity Harness; legacy Luminary toggle requests are rejected
        voidSealAffinity:
          type: string
          enum: [flare, continuum, verdance, abyss, radiance]
          description: Deprecated compatibility field; ignored by the game engine
        cardId:
          type: string
        tier:
          type: integer
        luminaryId:
          type: string
          description: Luminary ID for Luminary-specific action payloads
        eventId:
          type: string
          description: Event ID for resolve_summon action
        returnAffinities:
          type: object
          description: Affinities to return when a Harness or reserve would exceed the 10-Affinity holding limit (sparse map — include only the Affinities being returned; for reserve_artifact use exactly 1 total when the holding limit is reached)
          properties:
            flare:
              type: integer
              minimum: 0
              multipleOf: 1
            continuum:
              type: integer
              minimum: 0
              multipleOf: 1
            verdance:
              type: integer
              minimum: 0
              multipleOf: 1
            abyss:
              type: integer
              minimum: 0
              multipleOf: 1
            radiance:
              type: integer
              minimum: 0
              multipleOf: 1
            singularity:
              type: integer
              minimum: 0
              multipleOf: 1
        plannedActionData:
          type: object
          additionalProperties: true
          description: Nested action payload for plan_action type
        civName:
          type: string
          description: New civilization name for set_civ_name action
        orderedIds:
          type: array
          items:
            type: string
          description: Ordered list of luminaryIds for choose_luminary_order action
        confirmOverdrive:
          type: boolean
          description: Explicit confirmation required for a Mantle-to-Orbit Foundry third use
      required:
        - sessionToken
        - type
