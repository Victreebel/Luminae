openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Luminae multiplayer tabletop game API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: rooms
    description: Room management
  - name: game
    description: Game state and actions
  - name: auth
    description: Account authentication
  - name: onboarding
    description: First Contact completion, investigation, and rewards
  - name: friends
    description: Friends list and requests
  - name: challenges
    description: Player challenges
  - name: blueprints
    description: Blueprint clearance, ownership, and loadouts
  - name: store
    description: Store catalog, Lume purchases, and cosmetic loadouts
  - name: moderation
    description: Player safety and moderation operations
  - name: telemetry
    description: Privacy-preserving first-party operational telemetry
  - name: operations
    description: Restricted production operations

paths:
  /cards/lore:
    get:
      operationId: getCardLoreCatalog
      tags: [game]
      summary: Return name and flavour text for every card
      responses:
        "200":
          description: Card lore map keyed by card ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardLoreCatalog"

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /rooms:
    post:
      operationId: createRoom
      tags: [rooms]
      summary: Create a new game room
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoomBody"
      responses:
        "201":
          description: Room created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomWithPlayer"

  /rooms/{inviteCode}:
    get:
      operationId: getRoomByInviteCode
      tags: [rooms]
      summary: Get room info by invite code
      parameters:
        - name: inviteCode
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Room info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomInfo"
        "404":
          description: Room not found

  /rooms/{roomId}/join:
    post:
      operationId: joinRoom
      tags: [rooms]
      summary: Join a room
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinRoomBody"
      responses:
        "200":
          description: Joined room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomWithPlayer"
        "400":
          description: Cannot join room
        "404":
          description: Room not found

  /rooms/{roomId}/rejoin:
    post:
      operationId: rejoinRoom
      tags: [rooms]
      summary: Reclaim an existing player slot in a room (works in any status)
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejoinRoomBody"
      responses:
        "200":
          description: Rejoined room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomWithPlayer"
        "404":
          description: No matching player

  /rooms/{roomId}/ai-players:
    post:
      operationId: addAiPlayer
      tags: [rooms]
      summary: Add an AI player to the room (host only)
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddAiPlayerBody"
      responses:
        "200":
          description: AI player added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomPlayer"
        "400":
          description: Cannot add AI player
        "403":
          description: Not the host

  /rooms/{roomId}/start:
    post:
      operationId: startGame
      tags: [rooms]
      summary: Start the game (host only)
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HostActionBody"
      responses:
        "200":
          description: Game started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameState"
        "400":
          description: Cannot start game
        "403":
          description: Not the host

  /rooms/{roomId}/rematch:
    post:
      operationId: rematch
      tags: [rooms]
      summary: Vote to restart the game, optionally replaying the same opening board
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RematchBody"
      responses:
        "200":
          description: Rematch vote recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RematchVoteResponse"
        "400":
          description: Game is not finished
        "403":
          description: Not the host

  /rooms/{roomId}/state:
    get:
      operationId: getGameState
      tags: [game]
      summary: Get current game state
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
        - name: sessionToken
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Game state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameState"
        "403":
          description: Not a member of this room
        "404":
          description: Room not found

  /rooms/{roomId}/actions:
    post:
      operationId: submitAction
      tags: [game]
      summary: Submit a turn action
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActionRequest"
      responses:
        "200":
          description: Action applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameState"
        "400":
          description: Invalid action
        "403":
          description: Not your turn

  /rooms/{roomId}/players/{playerId}:
    delete:
      operationId: kickPlayer
      tags: [rooms]
      summary: Kick a player (host only)
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
        - name: playerId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HostActionBody"
      responses:
        "200":
          description: Player kicked
        "403":
          description: Not the host
        "404":
          description: Player not found

  /rooms/{roomId}/quit:
    post:
      operationId: quitRoom
      tags: [rooms]
      summary: Quit / forfeit a game
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuitRoomBody"
      responses:
        "200":
          description: Quit successfully
        "403":
          description: Not a member
        "404":
          description: Room not found

  /auth/register:
    post:
      operationId: registerAccount
      tags: [auth]
      summary: Create a new account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterBody"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountWithToken"
        "400":
          description: Validation error
        "409":
          description: Username or email already taken

  /auth/login:
    post:
      operationId: loginAccount
      tags: [auth]
      summary: Sign in to an existing account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountWithToken"
        "401":
          description: Invalid credentials

  /auth/logout:
    post:
      operationId: logoutAccount
      tags: [auth]
      summary: Invalidate the current account session
      security:
        - accountToken: []
      responses:
        "200":
          description: Logged out

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get the current account with active rooms
      security:
        - accountToken: []
      responses:
        "200":
          description: Current account with active rooms
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetMeResponse"
        "401":
          description: Unauthorized
    delete:
      operationId: deleteMyAccount
      tags: [auth]
      summary: Schedule authenticated account deletion after a seven-day safety period
      security:
        - accountToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteAccountBody"
      responses:
        "202":
          description: Account deletion scheduled and active sessions invalidated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountDeletionResult"
        "401":
          description: Password confirmation failed

  /onboarding/tutorial:
    get:
      operationId: getTutorialInvestigation
      tags: [onboarding]
      summary: Get account-backed First Contact progress
      security:
        - accountToken: []
      responses:
        "200":
          description: Tutorial investigation progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TutorialInvestigationProgress"
        "401":
          description: Unauthorized

  /onboarding/tutorial/complete:
    post:
      operationId: completeTutorialInvestigation
      tags: [onboarding]
      summary: Record the account's one canonical First Contact completion and base Lume grant
      security:
        - accountToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteTutorialInvestigationBody"
      responses:
        "200":
          description: First completion, or the unchanged canonical result of a repeated request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TutorialInvestigationProgress"
        "400":
          description: Invalid completion payload
        "401":
          description: Unauthorized

  /store:
    get:
      operationId: getStore
      tags: [store]
      summary: Get the account-visible store, Lume packs, ownership, and balance
      security:
        - accountToken: []
      responses:
        "200":
          description: Owner-private store state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreResponse"

  /store/lume/purchases/verify:
    post:
      operationId: verifyNativeLumePurchase
      tags: [store]
      summary: Verify a Google Play or Samsung IAP purchase before crediting Lume
      security:
        - accountToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NativePurchaseBody"
      responses:
        "200":
          description: Purchase credited, already credited, or awaiting provider settlement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NativePurchaseResult"
        "202":
          description: Provider reports the purchase as pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NativePurchaseResult"
        "400":
          description: Invalid purchase proof
        "403":
          description: Purchase belongs to another account

  /store/lume/purchases/reconcile:
    post:
      operationId: reconcileNativeLumePurchase
      tags: [operations, store]
      summary: Reconcile a provider purchase, settlement, cancellation, or refund
      security:
        - operationsToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReconcileNativePurchaseBody"
      responses:
        "200":
          description: Purchase reconciliation completed idempotently
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NativePurchaseReconciliationResult"
        "401":
          description: Operations authorization required
        "404":
          description: Purchase record not found

  /moderation/block:
    post:
      operationId: setPlayerBlocked
      tags: [moderation]
      summary: Block or unblock an account represented by a player in a shared room
      security:
        - accountToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModerationBlockBody"
      responses:
        "200":
          description: Block state updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModerationBlockResult"
        "404":
          description: Player is unavailable for moderation

  /moderation/report:
    post:
      operationId: reportPlayer
      tags: [moderation]
      summary: Create an auditable moderation report for a player in a shared room
      security:
        - accountToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModerationReportBody"
      responses:
        "201":
          description: Moderation report created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModerationReportResult"
        "404":
          description: Player is unavailable for moderation

  /telemetry/events:
    post:
      operationId: submitTelemetryEvents
      tags: [telemetry]
      summary: Submit a bounded batch of first-party reliability and progression events
      security:
        - accountToken: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelemetryBatch"
      responses:
        "202":
          description: Valid in-window events accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelemetryAcceptedResult"
        "400":
          description: Invalid telemetry batch

  /ops/health:
    get:
      operationId: getOperationsHealth
      tags: [operations]
      summary: Check database and WebSocket health for production monitoring
      security:
        - operationsToken: []
      responses:
        "200":
          description: Service and dependencies healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationsHealthResult"
        "404":
          description: Operations endpoint unavailable without authorization
        "503":
          description: A required dependency is degraded

  /blueprints/vault:
    get:
      operationId: getBlueprintVault
      tags: [blueprints]
      summary: Get owner-private Blueprint clearance, ownership, loadouts, and mastery
      security:
        - accountToken: []
      responses:
        "200":
          description: Owner-private Vault state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlueprintVaultResponse"

  /blueprints/vault/threshold:
    post:
      operationId: updateBlueprintVaultThreshold
      tags: [blueprints]
      summary: Idempotently record the Supreme Cipher, encounter approach, and dialogue memory
      security:
        - accountToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlueprintVaultThresholdBody"
      responses:
        "200":
          description: Threshold state recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlueprintVaultThresholdResult"
        "409":
          description: Conflicting approach or invalid threshold order

  /blueprints/vault/decryption-key:
    post:
      operationId: useBlueprintVaultDecryptionKey
      tags: [blueprints]
      summary: Consume a Black Market Decryption Key for one Vault access attempt
      security:
        - accountToken: []
      responses:
        "200":
          description: Temporary Vault access granted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlueprintDecryptionKeyUseResult"
        "403":
          description: No decryption key is available
        "409":
          description: The key is unnecessary or the defense forecast is active

  /blueprints/clearance-challenge:
    post:
      operationId: startBlueprintClearanceChallenge
      tags: [blueprints]
      summary: Idempotently start or resume the Lumii clearance scenario
      security:
        - accountToken: []
      responses:
        "200":
          description: Existing challenge resumed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlueprintChallengeSession"
        "201":
          description: New challenge created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlueprintChallengeSession"

  /blueprints/clearance-challenge/withdraw:
    post:
      operationId: withdrawBlueprintClearanceChallenge
      tags: [blueprints]
      summary: Idempotently withdraw from the active Lumii clearance scenario
      security:
        - accountToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                roomId:
                  type: string
              required:
                - roomId
      responses:
        "200":
          description: Challenge withdrawn without recording a match result
          content:
            application/json:
              schema:
                type: object
                properties:
                  roomId:
                    type: string
                  status:
                    type: string
                    enum: [classified, challenge_ready]
                required:
                  - roomId
                  - status

  /blueprints/vault/reveal-ack:
    post:
      operationId: acknowledgeBlueprintVaultReveal
      tags: [blueprints]
      summary: Mark the completed Vault opening as seen
      security:
        - accountToken: []
      responses:
        "200":
          description: Reveal acknowledged
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                  - ok

  /chronicles/progress:
    get:
      operationId: getChronicleCampaignProgress
      tags: [chronicles]
      summary: Read account-private Chronicle campaign progress
      security:
        - accountToken: []
      responses:
        "200":
          description: Chronicle campaign progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignProgressProjection"

  /chronicles/trace/start:
    post:
      operationId: startTraceChronicle
      tags: [chronicles]
      summary: Idempotently start or resume The Trace
      security:
        - accountToken: []
      responses:
        "200":
          description: Existing Chronicle resumed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraceChronicleSession"
        "201":
          description: New Chronicle created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraceChronicleSession"

  /chronicles/recurrence/start:
    post:
      operationId: startRecurrenceChronicle
      tags: [chronicles]
      summary: Idempotently start or resume The Recurrence
      security:
        - accountToken: []
      responses:
        "200":
          description: Existing Chronicle resumed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecurrenceChronicleSession"
        "201":
          description: New Chronicle created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecurrenceChronicleSession"

  /chronicles/triangulation/start:
    post:
      operationId: startTriangulationChronicle
      tags: [chronicles]
      summary: Idempotently start or resume The Triangulation
      security:
        - accountToken: []
      responses:
        "200":
          description: Existing Chronicle resumed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriangulationChronicleSession"
        "201":
          description: New Chronicle created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriangulationChronicleSession"
  /blueprints/loadouts/{mode}:
    put:
      operationId: updateBlueprintLoadout
      tags: [blueprints]
      summary: Replace the two Blueprint slots for one supported mode
      security:
        - accountToken: []
      parameters:
        - name: mode
          in: path
          required: true
          schema:
            type: string
            enum: [campaign, custom, competitive]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlueprintLoadoutBody"
      responses:
        "200":
          description: Updated loadout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlueprintLoadout"

  /cosmetics/loadout:
    put:
      operationId: updateCosmeticLoadout
      tags: [store]
      summary: Equip or clear one scoped cosmetic slot
      security:
        - accountToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CosmeticLoadoutBody"
      responses:
        "200":
          description: Updated lightweight cosmetic loadout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CosmeticLoadoutResponse"

  /auth/me/games:
    get:
      operationId: getMyGames
      tags: [auth]
      summary: List active (non-finished) games for the current account
      security:
        - accountToken: []
      responses:
        "200":
          description: List of active games
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveGamesResponse"
        "401":
          description: Unauthorized

  /auth/me/stats:
    get:
      operationId: getMyStats
      tags: [auth]
      summary: Get lifetime stats and game history for the current account
      security:
        - accountToken: []
      responses:
        "200":
          description: Lifetime stats and recent game history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerStatsResponse"
        "401":
          description: Unauthorized

  /friends:
    get:
      operationId: listFriends
      tags: [friends]
      summary: List accepted friends with online status
      security:
        - accountToken: []
      responses:
        "200":
          description: Friends list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendsListResponse"

  /friends/requests:
    get:
      operationId: listFriendRequests
      tags: [friends]
      summary: List incoming pending friend requests
      security:
        - accountToken: []
      responses:
        "200":
          description: Incoming requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendRequestsResponse"
    post:
      operationId: sendFriendRequest
      tags: [friends]
      summary: Send a friend request by username
      security:
        - accountToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendFriendRequestBody"
      responses:
        "201":
          description: Request sent
        "404":
          description: User not found
        "409":
          description: Already friends or request pending

  /friends/requests/{id}:
    patch:
      operationId: respondToFriendRequest
      tags: [friends]
      summary: Accept or decline a friend request
      security:
        - accountToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FriendRequestActionBody"
      responses:
        "200":
          description: Request updated
        "404":
          description: Request not found

  /friends/{id}:
    delete:
      operationId: removeFriend
      tags: [friends]
      summary: Remove a friend
      security:
        - accountToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Unfriended
        "404":
          description: Friendship not found

  /challenges:
    get:
      operationId: listChallenges
      tags: [challenges]
      summary: List incoming pending challenges
      security:
        - accountToken: []
      responses:
        "200":
          description: Pending challenges
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengesResponse"
    post:
      operationId: createChallenge
      tags: [challenges]
      summary: Challenge a friend to a game
      security:
        - accountToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChallengeBody"
      responses:
        "201":
          description: Challenge created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeCreatedResponse"
        "403":
          description: Not friends
        "404":
          description: User not found
        "409":
          description: Challenge already pending

  /challenges/{id}:
    patch:
      operationId: respondToChallenge
      tags: [challenges]
      summary: Accept or decline a challenge
      security:
        - accountToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChallengeActionBody"
      responses:
        "200":
          description: Challenge resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeAcceptedResponse"
        "404":
          description: Challenge not found
        "410":
          description: Challenge expired

components:
  securitySchemes:
    accountToken:
      type: http
      scheme: bearer
    operationsToken:
      type: http
      scheme: bearer
      description: Dedicated operations or purchase-reconciliation secret
  schemas:
    CardLoreEntry:
      type: object
      properties:
        name:
          type: string
        flavor:
          type: string
        artifactForm:
          type: string
        practicalCapability:
          type: string
        civLane:
          type: string
        engineeringScale:
          type: string
          enum:
            - Planetary
            - Star-system
            - Galactic
        depictionScale:
          type: string
          enum:
            - macro
            - tabletop
            - room
            - installation
            - planetary
            - stellar
            - galactic
        artPrompt:
          type: string
      required:
        - name
        - flavor

    CardLoreCatalog:
      type: object
      additionalProperties:
        $ref: "#/components/schemas/CardLoreEntry"

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    QuitRoomBody:
      type: object
      properties:
        sessionToken:
          type: string
      required:
        - sessionToken

    RegisterBody:
      type: object
      properties:
        username:
          type: string
          minLength: 2
          maxLength: 32
        password:
          type: string
          minLength: 6
        email:
          type: string
      required:
        - username
        - password

    LoginBody:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
        - username
        - password

    ArchitectFirstContactStance:
      type: string
      enum: [curious, guarded, resolute]

    FirstContactRapport:
      type: string
      enum: [receptive, probing, sparring]

    TutorialDiscoveryId:
      type: string
      enum: [lumii_origin, artifact_mastery, encryption_authority]

    TutorialInvestigationProgress:
      type: object
      properties:
        investigationId:
          type: string
          const: first_contact
        definitionVersion:
          type: integer
        completed:
          type: boolean
        completedAt:
          type: [string, "null"]
          format: date-time
        firstContactRapport:
          anyOf:
            - $ref: "#/components/schemas/FirstContactRapport"
            - type: "null"
        discoveries:
          type: array
          items:
            $ref: "#/components/schemas/TutorialDiscoveryId"
        completionLumeAwarded:
          type: integer
        lumeBalance:
          type: [integer, "null"]
      required:
        - investigationId
        - definitionVersion
        - completed
        - completedAt
        - firstContactRapport
        - discoveries
        - completionLumeAwarded
        - lumeBalance

    CompleteTutorialInvestigationBody:
      type: object
      properties:
        stance:
          $ref: "#/components/schemas/ArchitectFirstContactStance"
        rapport:
          anyOf:
            - $ref: "#/components/schemas/FirstContactRapport"
            - type: "null"
        discoveries:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/TutorialDiscoveryId"
      required: [stance, discoveries]

    ActiveRoomEntry:
      type: object
      properties:
        eventFrequency:
          $ref: "#/components/schemas/EventFrequency"
        roomId:
          type: string
        inviteCode:
          type: string
        status:
          type: string
          enum: [lobby, playing]
        sessionToken:
          type: string
        playerId:
          type: string
        isHost:
          type: boolean
        gameMode:
          $ref: "#/components/schemas/GameMode"
        scenarioId:
          type: ["string", "null"]
      required:
        - roomId
        - inviteCode
        - status
        - sessionToken
        - playerId
        - isHost
        - gameMode
        - scenarioId

    BlueprintClearanceSummary:
      type: object
      properties:
        qualifyingWins:
          type: integer
        requiredWins:
          type: integer
        status:
          type: string
          enum: [classified, challenge_ready, challenge_active, cleared]
        challengeRoomId:
          type: ["string", "null"]
        cipherDeactivated:
          type: boolean
        thresholdApproach:
          anyOf:
            - $ref: "#/components/schemas/LumiiThresholdApproach"
            - type: "null"
        thresholdDialoguePath:
          type: array
          items:
            $ref: "#/components/schemas/LumiiThresholdDialogueChoiceId"
        thresholdDialogueResolution:
          anyOf:
            - $ref: "#/components/schemas/LumiiThresholdDialogueResolution"
            - type: "null"
        thresholdRuptured:
          type: boolean
        covenantBroken:
          type: boolean
          deprecated: true
          description: Compatibility alias for thresholdRuptured.
        decryptionKeyBypassActive:
          type: boolean
        revealPending:
          type: boolean
      required:
        - qualifyingWins
        - requiredWins
        - status
        - challengeRoomId
        - cipherDeactivated
        - thresholdApproach
        - thresholdDialoguePath
        - thresholdDialogueResolution
        - thresholdRuptured
        - covenantBroken
        - decryptionKeyBypassActive
        - revealPending

    LumiiThresholdApproach:
      type: string
      enum: [kinship, inquiry, dominion]

    LumiiThresholdDialogueChoiceId:
      type: string
      enum:
        - kinship-want
        - kinship-fear
        - kinship-familiar
        - kinship-with-you
        - kinship-help
        - kinship-grow
        - inquiry-answer
        - inquiry-warning
        - inquiry-relation
        - inquiry-unsayable
        - inquiry-warning-against
        - inquiry-preserve
        - inquiry-risk
        - inquiry-pattern
        - dominion-decide
        - dominion-cipher
        - dominion-stand
        - dominion-stop

    LumiiThresholdDialogueResolution:
      type: string
      enum: [left, continued]

    BlueprintVaultThresholdBody:
      oneOf:
        - type: object
          properties:
            action:
              type: string
              enum: [deactivate_cipher]
          required:
            - action
        - type: object
          properties:
            action:
              type: string
              enum: [choose_approach]
            approach:
              $ref: "#/components/schemas/LumiiThresholdApproach"
          required:
            - action
            - approach
        - type: object
          properties:
            action:
              type: string
              enum: [record_dialogue_path]
            path:
              type: array
              maxItems: 3
              items:
                $ref: "#/components/schemas/LumiiThresholdDialogueChoiceId"
          required:
            - action
            - path
        - type: object
          properties:
            action:
              type: string
              enum: [resolve_dialogue]
            resolution:
              type: string
              enum: [left]
          required:
            - action
            - resolution
      discriminator:
        propertyName: action

    BlueprintVaultThresholdResult:
      type: object
      properties:
        ok:
          type: boolean
          enum: [true]
        status:
          type: string
          enum: [classified, challenge_ready, challenge_active, cleared]
        cipherDeactivated:
          type: boolean
        decryptionKeyBypassActive:
          type: boolean
        thresholdApproach:
          anyOf:
            - $ref: "#/components/schemas/LumiiThresholdApproach"
            - type: "null"
        thresholdDialoguePath:
          type: array
          items:
            $ref: "#/components/schemas/LumiiThresholdDialogueChoiceId"
        thresholdDialogueResolution:
          anyOf:
            - $ref: "#/components/schemas/LumiiThresholdDialogueResolution"
            - type: "null"
      required:
        - ok
        - status
        - cipherDeactivated
        - decryptionKeyBypassActive
        - thresholdApproach
        - thresholdDialoguePath
        - thresholdDialogueResolution

    BlueprintDecryptionKeyUseResult:
      type: object
      properties:
        ok:
          type: boolean
          enum: [true]
        status:
          type: string
          enum: [challenge_ready]
        alreadyActive:
          type: boolean
        decryptionKeyAvailable:
          type: boolean
          enum: [false]
        decryptionKeyBypassActive:
          type: boolean
          enum: [true]
      required:
        - ok
        - status
        - alreadyActive
        - decryptionKeyAvailable
        - decryptionKeyBypassActive

    CosmeticLoadoutItem:
      type: object
      properties:
        slot:
          type: string
          enum: [card_back, civilization_ambience, luminary_arrival_sound, blueprint_presentation, vault_seal]
        scopeKey:
          type: string
        itemId:
          type: string
      required:
        - slot
        - scopeKey
        - itemId

    BlueprintComponentDefinition:
      type: object
      properties:
        artifactId:
          type: string
        stage:
          type: string
        function:
          type: string
      required:
