openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Luminae multiplayer tabletop game API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: rooms
    description: Room management
  - name: game
    description: Game state and actions

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /rooms:
    post:
      operationId: createRoom
      tags: [rooms]
      summary: Create a new game room
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoomBody"
      responses:
        "201":
          description: Room created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomWithPlayer"

  /rooms/{inviteCode}:
    get:
      operationId: getRoomByInviteCode
      tags: [rooms]
      summary: Get room info by invite code
      parameters:
        - name: inviteCode
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Room info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomInfo"
        "404":
          description: Room not found

  /rooms/{roomId}/join:
    post:
      operationId: joinRoom
      tags: [rooms]
      summary: Join a room
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinRoomBody"
      responses:
        "200":
          description: Joined room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomWithPlayer"
        "400":
          description: Cannot join room
        "404":
          description: Room not found

  /rooms/{roomId}/rejoin:
    post:
      operationId: rejoinRoom
      tags: [rooms]
      summary: Reclaim an existing player slot in a room (works in any status)
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejoinRoomBody"
      responses:
        "200":
          description: Rejoined room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomWithPlayer"
        "404":
          description: No matching player

  /rooms/{roomId}/ai-players:
    post:
      operationId: addAiPlayer
      tags: [rooms]
      summary: Add an AI player to the room (host only)
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddAiPlayerBody"
      responses:
        "200":
          description: AI player added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomPlayer"
        "400":
          description: Cannot add AI player
        "403":
          description: Not the host

  /rooms/{roomId}/start:
    post:
      operationId: startGame
      tags: [rooms]
      summary: Start the game (host only)
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HostActionBody"
      responses:
        "200":
          description: Game started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameState"
        "400":
          description: Cannot start game
        "403":
          description: Not the host

  /rooms/{roomId}/rematch:
    post:
      operationId: rematch
      tags: [rooms]
      summary: Restart the game with the same players (host only)
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HostActionBody"
      responses:
        "200":
          description: Game restarted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameState"
        "400":
          description: Game is not finished
        "403":
          description: Not the host

  /rooms/{roomId}/state:
    get:
      operationId: getGameState
      tags: [game]
      summary: Get current game state
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
        - name: sessionToken
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Game state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameState"
        "403":
          description: Not a member of this room
        "404":
          description: Room not found

  /rooms/{roomId}/actions:
    post:
      operationId: submitAction
      tags: [game]
      summary: Submit a turn action
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActionRequest"
      responses:
        "200":
          description: Action applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameState"
        "400":
          description: Invalid action
        "403":
          description: Not your turn

  /rooms/{roomId}/players/{playerId}:
    delete:
      operationId: kickPlayer
      tags: [rooms]
      summary: Kick a player (host only)
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
        - name: playerId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HostActionBody"
      responses:
        "200":
          description: Player kicked
        "403":
          description: Not the host
        "404":
          description: Player not found

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    CreateRoomBody:
      type: object
      properties:
        hostName:
          type: string
        maxPlayers:
          type: integer
          minimum: 2
          maximum: 4
        turnTimerSeconds:
          type: ["integer", "null"]
          description: Optional per-turn time limit in seconds (null = no timer)
        avatarId:
          type: ["string", "null"]
          description: Avatar identifier chosen by the host
      required:
        - hostName
        - maxPlayers

    JoinRoomBody:
      type: object
      properties:
        playerName:
          type: string
        avatarId:
          type: ["string", "null"]
          description: Avatar identifier chosen by the joining player
      required:
        - playerName

    RejoinRoomBody:
      type: object
      properties:
        playerName:
          type: string
      required:
        - playerName

    HostActionBody:
      type: object
      properties:
        sessionToken:
          type: string
      required:
        - sessionToken

    AddAiPlayerBody:
      type: object
      properties:
        sessionToken:
          type: string
        difficulty:
          type: string
          enum: [easy, medium, hard]
      required:
        - sessionToken
        - difficulty

    RoomPlayer:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        isHost:
          type: boolean
        isConnected:
          type: boolean
        orderIndex:
          type: integer
        isAi:
          type: boolean
        aiDifficulty:
          type: ["string", "null"]
          enum: [easy, medium, hard, null]
        avatarId:
          type: ["string", "null"]
      required:
        - id
        - name
        - isHost
        - isConnected
        - orderIndex
        - isAi

    RoomInfo:
      type: object
      properties:
        id:
          type: string
        inviteCode:
          type: string
        status:
          type: string
          enum: [lobby, playing, finished]
        maxPlayers:
          type: integer
        turnTimerSeconds:
          type: ["integer", "null"]
        players:
          type: array
          items:
            $ref: "#/components/schemas/RoomPlayer"
      required:
        - id
        - inviteCode
        - status
        - maxPlayers
        - players

    RoomWithPlayer:
      type: object
      properties:
        room:
          $ref: "#/components/schemas/RoomInfo"
        player:
          $ref: "#/components/schemas/RoomPlayer"
        sessionToken:
          type: string
      required:
        - room
        - player
        - sessionToken

    CrystalCounts:
      type: object
      properties:
        ruby:
          type: integer
        sapphire:
          type: integer
        emerald:
          type: integer
        onyx:
          type: integer
        pearl:
          type: integer
        flux:
          type: integer
      required:
        - ruby
        - sapphire
        - emerald
        - onyx
        - pearl
        - flux

    ArtifactCard:
      type: object
      properties:
        id:
          type: string
        tier:
          type: integer
        bonusColor:
          type: string
          enum: [ruby, sapphire, emerald, onyx, pearl]
        lumens:
          type: integer
        cost:
          $ref: "#/components/schemas/CrystalCounts"
        name:
          type: string
        flavor:
          type: string
      required:
        - id
        - tier
        - bonusColor
        - lumens
        - cost
        - name
        - flavor

    ActionLogEntry:
      type: object
      properties:
        playerId:
          type: string
        playerName:
          type: string
        summary:
          type: string
        turn:
          type: integer
      required:
        - playerId
        - playerName
        - summary
        - turn

    Luminary:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        domain:
          type: string
          description: Cosmic domain or element of this Luminary (e.g. Flame, Time, Stars)
        lumens:
          type: integer
        requirements:
          $ref: "#/components/schemas/CrystalCounts"
        flavor:
          type: string
          description: Short lore/flavor text shown on the Luminary card
        summonColor:
          type: string
          description: Primary hex color used for glow and aura effects
        summonSecondaryColor:
          type: string
          description: Secondary hex color used for aura gradient
        auraStyle:
          type: string
          description: Named aura style for the summoning cutscene
      required:
        - id
        - name
        - domain
        - lumens
        - requirements
        - flavor
        - summonColor
        - summonSecondaryColor
        - auraStyle

    GamePlayerState:
      type: object
      properties:
        playerId:
          type: string
        playerName:
          type: string
        avatarId:
          type: ["string", "null"]
        isAi:
          type: boolean
          description: Whether this player is an AI
        aiDifficulty:
          type: ["string", "null"]
          enum: [easy, medium, hard, null]
          description: AI difficulty level, null for human players or easy AI that never toggles
        crystals:
          $ref: "#/components/schemas/CrystalCounts"
        bonuses:
          $ref: "#/components/schemas/CrystalCounts"
        lumens:
          type: integer
        reservedCards:
          type: array
          items:
            $ref: "#/components/schemas/ArtifactCard"
        purchasedCardIds:
          type: array
          items:
            type: string
        purchasedCards:
          type: array
          items:
            $ref: "#/components/schemas/ArtifactCard"
        isConnected:
          type: boolean
        claimedLuminaryIds:
          type: array
          items:
            type: string
          description: IDs of luminaries this player has claimed
        plannedAction:
          type: ["object", "null"]
          additionalProperties: true
          description: Pre-committed action to auto-execute when this player's turn arrives
        plannedActionCancelReason:
          type: ["string", "null"]
          description: Reason the last planned action was auto-cancelled, if applicable
      required:
        - playerId
        - playerName
        - isAi
        - crystals
        - bonuses
        - lumens
        - reservedCards
        - purchasedCardIds
        - purchasedCards
        - isConnected
        - claimedLuminaryIds

    LuminaryActiveState:
      type: object
      properties:
        luminaryId:
          type: string
        ownerId:
          type: string
        activeAffinity:
          type: string
          enum: [ruby, sapphire, emerald, onyx, pearl]
        eligibleAffinities:
          type: array
          items:
            type: string
            enum: [ruby, sapphire, emerald, onyx, pearl]
        summonedAtTurnCount:
          type: integer
      required:
        - luminaryId
        - ownerId
        - activeAffinity
        - eligibleAffinities
        - summonedAtTurnCount

    GameState:
      type: object
      properties:
        roomId:
          type: string
        status:
          type: string
          enum: [lobby, playing, finished]
        currentPlayerIndex:
          type: integer
        roundNumber:
          type: integer
        turnCount:
          type: integer
          description: Monotonically increasing counter incremented each time any player's turn ends
        crystalBank:
          $ref: "#/components/schemas/CrystalCounts"
        marketTier1:
          type: array
          items:
            $ref: "#/components/schemas/ArtifactCard"
        marketTier2:
          type: array
          items:
            $ref: "#/components/schemas/ArtifactCard"
        marketTier3:
          type: array
          items:
            $ref: "#/components/schemas/ArtifactCard"
        deckCounts:
          type: object
          properties:
            tier1:
              type: integer
            tier2:
              type: integer
            tier3:
              type: integer
          required:
            - tier1
            - tier2
            - tier3
        luminaries:
          type: array
          items:
            $ref: "#/components/schemas/Luminary"
        luminaryAffinities:
          type: array
          description: Active affinity state for each claimed Luminary
          items:
            $ref: "#/components/schemas/LuminaryActiveState"
        players:
          type: array
          items:
            $ref: "#/components/schemas/GamePlayerState"
        winnerId:
          type: ["string", "null"]
        lastAction:
          type: ["object", "null"]
          additionalProperties: true
        actionLog:
          type: array
          items:
            $ref: "#/components/schemas/ActionLogEntry"
        turnTimerSeconds:
          type: ["integer", "null"]
        turnDeadline:
          type: ["integer", "null"]
          description: Unix timestamp (ms) when the current turn auto-passes; null if no timer
        version:
          type: integer
      required:
        - roomId
        - status
        - currentPlayerIndex
        - roundNumber
        - turnCount
        - crystalBank
        - marketTier1
        - marketTier2
        - marketTier3
        - deckCounts
        - luminaries
        - luminaryAffinities
        - players
        - winnerId
        - lastAction
        - actionLog
        - version

    ActionRequest:
      type: object
      properties:
        sessionToken:
          type: string
        type:
          type: string
          enum:
            - take_three_crystals
            - take_two_crystals
            - reserve_card
            - purchase_card
            - purchase_reserved
            - pass
            - surrender
            - toggle_luminary_affinity
            - resolve_summon
            - plan_action
            - cancel_plan
        crystals:
          $ref: "#/components/schemas/CrystalCounts"
        crystal:
          type: string
          enum: [ruby, sapphire, emerald, onyx, pearl]
        cardId:
          type: string
        tier:
          type: integer
        luminaryId:
          type: string
          description: Luminary ID for toggle_luminary_affinity action
        affinity:
          type: string
          enum: [ruby, sapphire, emerald, onyx, pearl]
          description: Target affinity for toggle_luminary_affinity action
        eventId:
          type: string
          description: Event ID for resolve_summon action
        plannedActionData:
          type: object
          additionalProperties: true
          description: Nested action payload for plan_action type
      required:
        - sessionToken
        - type
